<!DOCTYPE html>
<html lang="pl">
<head>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title data-i18n="display.title">Familiada — Wyświetlacz (v2)</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script type="module" src="./display2/js/main.js?v=v2026-09-10T23082"></script>
  <link rel="stylesheet" href="./display/styles.css?v=v2026-09-10T23082" />
  <link rel="icon" href="favicon.ico?v=v2026-09-10T23082" />
</head>
<body>
  <button id="fsBtn" class="fs-btn" type="button" title="Pełny ekran" data-i18n-title="common.fullscreen">▢</button>

  <!-- TRYB QR — host i buzzer NIEZALEŻNE, jeden LUB oba naraz (dokładnie
       jak dzisiejszy display.html — ta sama markup/CSS, reużyty
       display/js/qr.js jako czysty kontroler DOM bez związku z komendami). -->
  <div id="qrScreen" class="qr-screen hidden" aria-hidden="true">
    <div class="qr-grid">
      <div class="qr-card" id="qrHostCard">
        <img id="qrHostImg" class="qr-img" alt="QR Prowadzący" data-i18n-alt="display.qrHostAlt"/>
        <div id="qrHostCode" class="qr-code"></div>
        <div class="qr-label" data-i18n="display.qrHost">Prowadzący</div>
      </div>
      <div class="qr-card" id="qrBuzzerCard">
        <img id="qrBuzzerImg" class="qr-img" alt="QR Przyciski" data-i18n-alt="display.qrBuzzerAlt"/>
        <div id="qrBuzzerCode" class="qr-code"></div>
        <div class="qr-label" data-i18n="display.qrBuzzer">Przyciski</div>
      </div>
    </div>
  </div>

  <!-- TRYB GRA – 3 warstwy (identyczne jak dzisiejszy display.html, ta sama
       styles.css — wygląd się nie zmienia). -->
  <div id="gameScreen" class="hidden">
    <div id="displayRoot" class="display-root">
      <div class="layer-bg"></div>
      <div class="display-frame">
        <svg class="layer-base" id="baseSvg" viewBox="0 0 1280 720" overflow="visible"></svg>
        <svg class="layer-displays" id="displaysSvg" viewBox="0 0 1280 720"><g id="displays"></g></svg>
      </div>
    </div>
  </div>
  <div id="blackScreen" class="black-screen"></div>

  <!-- Zgłoszone: gdy dźwięk gra z Wyświetlacza (settings.soundSource==="display"),
       przeglądarki wymagają gestu użytkownika, zanim odtwarzanie w ogóle
       zadziała (nikt normalnie nie dotyka ekranu w trakcie gry) — ten ekran
       jest tym gestem, na wierzchu WSZYSTKIEGO (nad #qrScreen/#blackScreen/
       #gameScreen), dopóki display2/js/main.js's isAudioUnlocked() nie
       zwróci true. Domyślnie ukryty (hidden w display2/js/main.js's
       syncAudioUnlockScreen() decyduje, kiedy pokazać) — nigdy nie istnieje
       w starym display.html, więc ta sama, współdzielona display/styles.css
       jest dla niego bezpieczna (selektor po ID, nic tam nie trafia). -->
  <div id="audioUnlockScreen" class="audio-unlock-screen hidden" aria-hidden="true">
    <div class="audio-unlock-title" data-i18n="display.audioUnlockTitle">Odblokuj dźwięk</div>
    <button id="btnAudioUnlock" class="audio-unlock-btn" type="button" data-i18n="display.audioUnlockBtn">🔊 Odblokuj</button>
    <div class="audio-unlock-hint" data-i18n="display.audioUnlockHint">Dźwięk gry będzie odtwarzany na tym urządzeniu — kliknij, żeby przeglądarka na to pozwoliła.</div>
  </div>
</body>
</html>
