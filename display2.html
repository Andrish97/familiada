<!DOCTYPE html>
<html lang="pl">
<head>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Familiada — Wyświetlacz (v2)</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script type="module" src="./display2/js/main.js?v=v2026-09-05T19503"></script>
  <link rel="stylesheet" href="./display/styles.css?v=v2026-09-05T19503" />
  <link rel="icon" href="favicon.ico?v=v2026-09-05T19503" />
</head>
<body>
  <button id="fsBtn" class="fs-btn" type="button" title="Pełny ekran">▢</button>

  <!-- TRYB QR — host i buzzer NIEZALEŻNE, jeden LUB oba naraz (dokładnie
       jak dzisiejszy display.html — ta sama markup/CSS, reużyty
       display/js/qr.js jako czysty kontroler DOM bez związku z komendami). -->
  <div id="qrScreen" class="qr-screen hidden" aria-hidden="true">
    <div class="qr-grid">
      <div class="qr-card" id="qrHostCard">
        <img id="qrHostImg" class="qr-img" alt="QR Prowadzący"/>
        <div id="qrHostCode" class="qr-code"></div>
        <div class="qr-label">Prowadzący</div>
      </div>
      <div class="qr-card" id="qrBuzzerCard">
        <img id="qrBuzzerImg" class="qr-img" alt="QR Przyciski"/>
        <div id="qrBuzzerCode" class="qr-code"></div>
        <div class="qr-label">Przyciski</div>
      </div>
    </div>
  </div>

  <!-- TRYB GRA – 3 warstwy (identyczne jak dzisiejszy display.html, ta sama
       styles.css — wygląd się nie zmienia). -->
  <div id="gameScreen" class="hidden">
    <div id="displayRoot" class="display-root">
      <div class="layer-bg"></div>
      <div class="display-frame">
        <svg class="layer-base" id="baseSvg" viewBox="0 0 1280 720" overflow="visible"></svg>
        <svg class="layer-displays" id="displaysSvg" viewBox="0 0 1280 720"><g id="displays"></g></svg>
      </div>
    </div>
  </div>
  <div id="blackScreen" class="black-screen"></div>
</body>
</html>
