<!DOCTYPE html>
<html lang="pl">
<head>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta name="app-version" content="v2026-10-19T11161"/>


  <meta charset="UTF-8"/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://supabase.familiada.online">
  <title data-i18n="connectDevice.title">Familiada — podłącz urządzenie</title>

  <link rel="icon" href="/favicon.ico?v=v2026-10-19T11161"/>
  <link rel="manifest" href="/manifest.json?v=v2026-10-19T11161"/>
  <meta name="theme-color" content="#050914"/>
  <link rel="stylesheet" href="/shared/css/base.css?v=v2026-10-19T11161"/>
  <link rel="stylesheet" href="/games/css/games.css?v=v2026-10-19T11161"/>
  <link rel="stylesheet" href="/connect/css/connect-device.css?v=v2026-10-19T11161"/>

  <script>document.documentElement.classList.add('page-loading')</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="/shared/js/core/security-warning.js?v=v2026-10-19T11161" defer></script>
  <script type="module" src="/connect/js/connect-device.js?v=v2026-10-19T11161" defer></script>
  <script type="module" src="/shared/js/core/topbar-controller.js?v=v2026-10-19T11161" defer></script>

</head>

<body class="games-body connect-device-body skel-body">
  <header class="topbar topbar-layout-4">
    <div class="topbar-section topbar-section-1">
      <div class="brand">FAMILIADA</div>
      <button class="btn" id="btnBack" type="button" data-i18n-icon="arrow-left">Wstecz</button>
    </div>
    <div class="topbar-section topbar-section-2"></div>
    <div class="topbar-section topbar-section-3">
      <button class="btn" id="btnManual" type="button" data-i18n-aria-label="common.manualLabel" data-i18n-title="common.manualLabel" aria-label="Wskazówki" title="Wskazówki"><i class="ico" data-icon="info"></i></button>
      <!-- switcher języka wstrzykiwany przez initI18n -->
    </div>
    <div class="topbar-section topbar-section-4">
      <span class="who" id="who"></span>
      <button class="btn" id="btnLogout" type="button" data-i18n="common.authEntry" data-i18n-icon="person">Zaloguj / Załóż konto</button>
    </div>
  </header>

  <main class="wrap">
    <div class="bar">
      <div>
        <div class="title" data-i18n="connectDevice.header.title">Podłącz urządzenie</div>
        <div class="hint" id="pageHint"></div>
      </div>
      <div class="actions">
        <!-- tylko na mobile/tablet – skanowanie QR -->
        <button class="btn sm gold" id="btnScanQr" style="display:none;" type="button" data-i18n="connectDevice.scan.btn" data-i18n-icon="camera">Skanuj QR</button>
      </div>
    </div>

    <section class="games-shell" data-skel-step>
      <div class="card games-card tasks-card connect-device-main-card">
        <div class="tasks-scroll">
          <section class="card connect-device-inner-card" id="enterCodeCard">
            <div class="shareSectionTitle connect-device-card-header" data-i18n="connectDevice.enterCode.title">Podłącz kodem</div>
            <div class="connect-device-enter-code-row">
              <input class="inp connect-device-code-input" id="connectCodeInput" type="text" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off" spellcheck="false" data-i18n-placeholder="connectDevice.enterCode.placeholder"/>
              <button class="btn gold" id="btnConnectCode" type="button" data-i18n="connectDevice.enterCode.btn" data-i18n-icon="arrow-right">Podłącz</button>
            </div>
            <div id="connectCodeMsg" class="connect-device-msg"></div>
          </section>

          <section class="card connect-device-inner-card" id="sharedDevicesCard" hidden>
            <div class="shareSectionTitle connect-device-card-header" data-i18n="connectDevice.shared.title">Urządzenia udostępnione dla mnie</div>
            <div id="sharedDevicesList" class="shareList"></div>
          </section>
        </div>
      </div>
    </section>

  </main>

  <footer class="footer wrap">
    <div data-i18n="common.footer.left">© 2026 Familiada — system do gry na żywo</div>
    <button class="btn-contact-footer" type="button" data-contact-modal data-i18n="common.contactBtn">Kontakt</button>
  </footer>

  <!-- Modal: podgląd urządzenia po kodzie -->
  <div class="overlay modal--sheet" id="devicePreviewOverlay" style="display:none;">
    <div class="modal">
      <div class="mHead">
        <div class="mTitle" id="devicePreviewTitle">Urządzenie</div>
        <button class="btn sm" id="btnDevicePreviewClose" type="button" aria-label="Zamknij" data-i18n-aria-label="common.modal.closeLabel"><i class="ico" data-icon="close"></i></button>
      </div>
      <div class="mSub" id="devicePreviewSub"></div>
      <div class="importRow modal-actions" style="margin-top:16px;">
        <button class="btn" id="btnDevicePreviewCancel" type="button" data-i18n="common.cancel" data-i18n-icon="close">Anuluj</button>
        <button class="btn gold" id="btnDevicePreviewConnect" type="button" data-i18n="connectDevice.enterCode.connectBtn" data-i18n-icon="arrow-right">Połącz</button>
      </div>
    </div>
  </div>

  <script type="module" src="/shared/js/core/contact-modal.js?v=v2026-10-19T11161"></script>

</body>
</html>
