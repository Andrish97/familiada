<!DOCTYPE html>
<html lang="pl">
<head>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta charset="UTF-8"/>
  <meta name="i18n-parts" content="mails tasks">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"/>
  <script src="/shared/js/core/page-boot.js?v=v2026-10-26T00204"></script>
  <link rel="canonical" href="https://www.familiada.online/mails/"/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="referrer" content="no-referrer"/>
  <meta name="app-version" content="v2026-10-26T00204"/>
  <title data-i18n="mailCenter.pageTitle">Familiada — centrum maili</title>
  <link rel="icon" href="/favicon.ico?v=v2026-10-26T00204"/>
  <link rel="stylesheet" href="/shared/css/blocking-overlay.css?v=v2026-10-26T00204" />
  <link rel="stylesheet" href="/shared/style/tokens.css?v=v2026-10-26T00204"/>
  <link rel="stylesheet" href="/shared/style/base.css?v=v2026-10-26T00204"/>
  <link rel="stylesheet" href="/shared/style/components.css?v=v2026-10-26T00204"/>
  <link rel="stylesheet" href="/shared/style/layout.css?v=v2026-10-26T00204"/>
  <link rel="stylesheet" href="/shared/style/utilities.css?v=v2026-10-26T00204"/>
  <link rel="stylesheet" href="/go/css/go.css?v=v2026-10-26T00204"/>
  <link rel="stylesheet" href="/shared/css/polls.css?v=v2026-10-26T00204"/>
  <link rel="stylesheet" href="/mail/css/mail.css?v=v2026-10-26T00204"/>
  <script type="module" src="/shared/js/core/device-attrs.js?v=v2026-10-26T00204"></script>
  <script type="module" src="/mail/js/mail.js?v=v2026-10-26T00204"></script>

</head>
<body class="poll-go-body mail-body">
  <header class="topbar topbar-layout-4 topbar-mobile-keep-brand">
    <div class="topbar-section topbar-section-1"><a class="brand" href="/">FAMILIADA</a></div>
    <div class="topbar-section topbar-section-2"></div>
    <div class="topbar-section topbar-section-3"><a class="btn icon" id="btnManual" href="/manual/?ch=14#s-14-5" data-i18n-aria-label="common.manualLabel" data-i18n-title="common.manualLabel" aria-label="Wskazówki" title="Wskazówki"><i class="ico" data-icon="info" aria-hidden="true"></i></a></div>
    <div class="topbar-section topbar-section-4"></div>
  </header>
  <main class="mail-wrap">
    <section class="mail-summary" id="mailSummary" data-skel-step hidden>
      <section class="mail-preference" id="mailPreference" aria-labelledby="mailPreferenceTitle">
        <div><h2 id="mailPreferenceTitle"></h2><p id="mailPreferenceText"></p></div><button id="mailPreferenceButton" class="btn sm" type="button"></button>
      </section>
    </section>
    <section class="card card--entry poll-go-card mail-entry" id="mailEntry" data-skel-step aria-labelledby="mailTitle">
      <div class="mail-heading" id="mailHeading"><h1 class="poll-go-title" id="mailTitle" data-i18n="mailCenter.loading">Ładuję…</h1><span id="mailAddress" hidden></span></div>
      <p class="poll-go-sub" id="mailMessage" role="status"></p>
      <form id="mailForm" class="mail-form" hidden>
        <div class="mail-form-row"><input id="mailInput" class="inp" type="email" autocomplete="email" maxlength="320" required data-i18n-placeholder="mailCenter.emailPlaceholder" data-i18n-aria-label="mailCenter.emailLabel" placeholder="Wpisz swój adres e-mail" aria-label="Twój adres e-mail"/><button class="btn gold" type="submit" data-i18n="mailCenter.sendLink" data-i18n-icon="envelope-out">Wyślij link</button></div>
      </form>
      <div id="mailActions" class="cluster poll-go-actions"></div>
    </section>
    <section class="games-shell mail-list-shell" id="mailLists" data-skel-step hidden>
      <div class="tabs-card tabs-card--split mail-tabs-card">
        <div class="tabs-strip" role="tablist">
          <div class="tab-slot">
            <button class="tab-label" id="subscriptionTab" type="button" aria-controls="subscriptionPanel" data-split-tab="subscriptions"><span data-i18n="mailCenter.subscriptions">Subskrypcje</span><span class="badge" id="subscriptionBadge" hidden></span></button>
          </div>
          <div class="tab-slot">
            <button class="tab-label" id="itemsTab" type="button" aria-controls="itemsPanel" data-split-tab="items"><span data-i18n="mailCenter.tasksTab">Zadania</span><span class="badge" id="itemsBadge" hidden></span></button>
          </div>
        </div>
        <div class="split-panels">
        <section class="card mail-panel" id="subscriptionPanel" data-split-panel="subscriptions" aria-labelledby="subscriptionTitle">
          <h2 class="section-title mail-panel-title" id="subscriptionTitle"><span data-i18n="mailCenter.subscriptions">Subskrypcje</span></h2>
          <div class="shareList" id="subscriptionList"></div>
        </section>
        <section class="card mail-panel" id="itemsPanel" data-split-panel="items" aria-labelledby="itemsTitle">
          <h2 class="section-title mail-panel-title" id="itemsTitle"><span data-i18n="mailCenter.tasksTab">Zadania</span></h2>
          <div class="shareList" id="itemsList"></div>
        </section>
        </div>
      </div>
    </section>
    <aside class="mail-discover"><span data-i18n="mailCenter.discover">Familiada na Twoje spotkania i wydarzenia.</span><a href="/" data-i18n="mailCenter.explore">Poznaj system</a><a href="/login/" data-i18n="mailCenter.register">Logowanie i rejestracja</a></aside>
  </main>
  <footer class="footer mail-footer"><div data-i18n="common.footer.left">© 2026 Familiada — system do gry na żywo</div><button class="btn-contact-footer" type="button" data-contact-modal data-i18n="common.contactBtn">Kontakt</button></footer>
  <script type="module" src="/shared/js/core/contact-modal.js?v=v2026-10-26T00204"></script>

</body>
</html>
