<!DOCTYPE html>
<html lang="pl" data-device-guard-pending>
<head>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta charset="UTF-8"/>
  <meta name="i18n-parts" content="control">
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"/>
  <title data-i18n="host.title">Familiada — prowadzący</title>
  <link rel="icon" href="/favicon.ico?v=v2026-10-25T10522"/>
  <link rel="stylesheet" href="/shared/css/blocking-overlay.css?v=v2026-10-25T10522" />
  <link rel="stylesheet" href="/shared/style/tokens.css?v=v2026-10-25T10522"/>
  <link rel="stylesheet" href="/shared/style/flat.css?v=v2026-10-25T10522"/>
  <link rel="stylesheet" href="/control/host/css/host.css?v=v2026-10-25T10522"/>
  <script src="/shared/js/core/module-boot-guard.js?v=v2026-10-25T10522"></script>
  <script type="module" src="/shared/js/core/device-attrs.js?v=v2026-10-25T10522"></script>
  <script src="/shared/vendor/supabase-js.js?v=v2026-10-25T10522" defer></script>
  <script type="module" src="/control/host/js/main.js?v=v2026-10-25T10522" defer></script>

</head>
<body class="host-body" data-device-screen data-requires-touch="true">
  <button class="corner-btn fs-btn" id="btnFullscreen" type="button" aria-label="Pełny ekran" title="Pełny ekran" data-i18n-aria-label="common.fullscreen" data-i18n-title="common.fullscreen"><i class="ico" data-icon="fullscreen-enter"></i></button>

  <div class="a2hs" id="hostA2HS" role="dialog" aria-modal="true" aria-labelledby="hostA2HSTitle" aria-hidden="true">
    <div class="a2hsCard">
      <h2 class="a2hsTitle" id="hostA2HSTitle" data-i18n="common.a2hsTitle">Pełny ekran na iPhone</h2>
      <p class="a2hsText" data-i18n-html="common.a2hsHost">W Safari nie da się wymusić prawdziwego pełnego ekranu. Użyj <b>Udostępnij</b> → <b>Do ekranu początkowego</b>, a potem uruchom jako aplikację.</p>
      <button class="btn a2hsClose" id="hostA2HSClose" type="button" data-i18n="common.a2hsOk" data-i18n-icon="check">OK</button>
    </div>
  </div>

  <main class="paper paperSplit" id="paper" data-skel-step>
    <i class="redMargin" aria-hidden="true"></i>
    <section class="pane pane1" aria-label="Tekst 1">
      <div class="lineGrid" id="lineGrid1" aria-hidden="true"></div>
      <pre class="text" id="paperText1"></pre>
    </section>
    <div class="splitLine" id="splitLine" aria-hidden="true"></div>
    <section class="pane pane2" aria-label="Tekst 2">
      <div class="lineGrid" id="lineGrid2" aria-hidden="true"></div>
      <pre class="text" id="paperText2"></pre>
      <div class="cover2 coverOn" id="cover2" aria-hidden="true">
        <div class="cover2Content">
          <div class="cover2Logo" id="cover2Logo" aria-hidden="true"></div>
          <div class="cover2Swipe" id="cover2Swipe">—</div>
        </div>
      </div>
      <div class="p2Hint" id="p2Hint" aria-hidden="true">—</div>
    </section>
  </main>
  <div class="device-load-error" id="deviceLoadError" role="alert" hidden>
    <span data-i18n="common.genericError">Wystąpił błąd.</span>
    <button class="btn" type="button" data-retry-device data-i18n="common.refresh" data-i18n-icon="refresh">Odśwież</button>
  </div>
</body>
</html>
