<!DOCTYPE html>
<html lang="pl">
<head>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title data-i18n="display.title">Familiada — wyświetlacz</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script type="module" src="/control/display/js/main.js?v=v2026-10-09T12404"></script>
  <link rel="stylesheet" href="/control/display/css/styles.css?v=v2026-10-09T12404" />
  <link rel="icon" href="/favicon.ico?v=v2026-10-09T12404" />
</head>
<body>
  <button id="fsBtn" class="fs-btn" type="button" title="Pełny ekran" aria-label="Pełny ekran" data-i18n-title="common.fullscreen"><i class="ico" data-icon="fullscreen-enter"></i></button>

  <!-- TRYB QR — host i buzzer NIEZALEŻNE, jeden LUB oba naraz (dokładnie
       jak dzisiejszy display.html — ta sama markup/CSS, reużyty
       control/display/js/qr.js jako czysty kontroler DOM bez związku z komendami). -->
  <div id="qrScreen" class="qr-screen hidden" aria-hidden="true">
    <div class="qr-grid">
      <div class="qr-card" id="qrHostCard">
        <img id="qrHostImg" class="qr-img" alt="QR Prowadzący" data-i18n-alt="display.qrHostAlt"/>
        <div id="qrHostCode" class="qr-code"></div>
        <div class="qr-label" data-i18n="display.qrHost">Prowadzący</div>
      </div>
      <div class="qr-card" id="qrBuzzerCard">
        <img id="qrBuzzerImg" class="qr-img" alt="QR Przyciski" data-i18n-alt="display.qrBuzzerAlt"/>
        <div id="qrBuzzerCode" class="qr-code"></div>
        <div class="qr-label" data-i18n="display.qrBuzzer">Przyciski</div>
      </div>
    </div>
  </div>

  <!-- TRYB GRA – 3 warstwy (identyczne jak dzisiejszy display.html, ta sama
       styles.css — wygląd się nie zmienia). -->
  <div id="gameScreen" class="hidden">
    <div id="displayRoot" class="display-root">
      <div class="layer-bg"></div>
      <div class="display-frame">
        <svg class="layer-base" id="baseSvg" viewBox="0 0 1280 720" overflow="visible"></svg>
        <svg class="layer-displays" id="displaysSvg" viewBox="0 0 1280 720"><g id="displays"></g></svg>
      </div>
    </div>
  </div>
  <div id="blackScreen" class="black-screen"></div>

  <!-- Gdy źródłem dźwięku jest Wyświetlacz (settings.soundSource="display"),
       przeglądarka może wymagać gestu użytkownika przed odtwarzaniem. Ekran
       odblokowania jest wtedy nad #qrScreen/#blackScreen/#gameScreen i znika
       po kliknięciu. Przy źródle Control pozostaje ukryty. Nie istnieje w
       starym display.html; współdzielone display/styles.css celuje w ID. -->
  <div id="audioUnlockScreen" class="audio-unlock-screen hidden" aria-hidden="true">
    <button id="btnAudioUnlock" class="audio-unlock-btn" type="button" data-i18n="display.audioUnlockBtn" data-i18n-icon="speaker-on">Odblokuj dźwięk</button>
  </div>
</body>
</html>
