<!doctype html>
<html lang="pl">
<head>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="preconnect" href="https://supabase.familiada.online">
  <title data-i18n="control.title">Familiada — panel sterowania</title>

  <link rel="icon" href="/favicon.ico?v=v2026-10-23T15275"/>
  <link rel="stylesheet" href="/shared/css/blocking-overlay.css?v=v2026-10-23T15275" />
  <link rel="stylesheet" href="/shared/style/tokens.css?v=v2026-10-23T15275"/>
  <link rel="stylesheet" href="/shared/style/base.css?v=v2026-10-23T15275"/>
  <link rel="stylesheet" href="/shared/style/components.css?v=v2026-10-23T15275"/>
  <link rel="stylesheet" href="/shared/style/layout.css?v=v2026-10-23T15275"/>
  <link rel="stylesheet" href="/shared/style/utilities.css?v=v2026-10-23T15275"/>
  <link rel="stylesheet" href="/control/css/control.css?v=v2026-10-23T15275"/>

  <script>document.documentElement.classList.add('page-loading')</script>

  <script>if(matchMedia('(max-width:980px)').matches)document.documentElement.dataset.mobileGuard=''</script>
  <style>html[data-mobile-guard]{overflow:hidden;touch-action:none}html[data-mobile-guard] body{visibility:hidden}</style>

  <script src="/shared/vendor/supabase-js.js?v=v2026-10-23T15275" defer></script>
  <script src="/shared/js/core/security-warning.js?v=v2026-10-23T15275" defer></script>
  <script type="module">
    import { initI18n } from "/shared/translation/translation.js?v=v2026-10-23T15275";
    await initI18n({ withSwitcher: true });
    document.documentElement.classList.remove('page-loading');
    import("/control/js/app.js?v=v2026-10-23T15275");

  </script>

  <link rel="stylesheet" href="/control/css/control2.css?v=v2026-10-23T15275"/>
<link rel="stylesheet" href="/control/css/test-mode.css?v=v2026-10-23T15275"/>

</head>
<body class="control-body skel-body">
  <header class="topbar topbar-layout-4">
    <div class="topbar-section topbar-section-1">
      <div class="brand">FAMILIADA</div>
      <button class="btn" id="btnBack" type="button" data-i18n-icon="arrow-left">Wstecz</button>
    </div>
    <div class="topbar-section topbar-section-2">
      <!-- Klikalne przez cały czas gry (nie tylko na kroku Urządzenia) — po
           to są te modale: jeśli urządzenie trzeba ponownie podłączyć w
           trakcie rozgrywki (restart tabletu itp.), operator musi mieć skąd
           wziąć kod/QR bez wracania do kroku Urządzenia. Otwiera ten sam
           #qrModalOverlay co przycisk "Kod QR" w kroku Urządzenia. -->
      <div class="c2-topbar-progress" id="c2TopbarProgress" aria-live="polite"></div>
      <div class="top-status" aria-label="Status urządzeń" data-i18n-aria-label="control.statusLabel">
      <button class="btn" id="btnFriends" type="button" data-nav-hidden="true" style="display:none;"><span data-i18n="games.nav.friends" data-i18n-icon-after="people">Znajomi</span><span class="badge" data-nav-contact-count="friends" aria-hidden="true"></span></button>
        <div class="dotRow" title="Wyświetlacz" id="dotDisplayRow" data-i18n-title="control.deviceDisplay" style="cursor:pointer;">
          <span class="dot mid" id="dotDisplay"></span><i class="ico" data-icon="display" aria-hidden="true"></i><span class="lbl" data-i18n="control.deviceDisplay">Wyświetlacz</span>
        </div>
        <div class="dotRow" title="Prowadzący" id="dotHostRow" data-i18n-title="control.deviceHost" style="cursor:pointer;">
          <span class="dot mid" id="dotHost"></span><i class="ico" data-icon="host" aria-hidden="true"></i><span class="lbl" data-i18n="control.deviceHost">Prowadzący</span>
        </div>
        <div class="dotRow" title="Przycisk" id="dotBuzzerRow" data-i18n-title="control.deviceBuzzer" style="cursor:pointer;">
          <span class="dot mid" id="dotBuzzer"></span><i class="ico" data-icon="buzzer" aria-hidden="true"></i><span class="lbl" data-i18n="control.deviceBuzzer">Przycisk do pojedynku</span>
        </div>
      </div>
    </div>
    <div class="topbar-section topbar-section-3">
      <button class="btn" id="btnMute" type="button" title="Wycisz dźwięk" aria-label="Wycisz dźwięk"><i class="ico" data-icon="speaker-on"></i></button>
      <button class="btn" id="btnStartOver" type="button" title="Zacznij od nowa" aria-label="Zacznij od nowa"><i class="ico" data-icon="refresh"></i></button>
      <button class="btn" id="btnManual" type="button" data-i18n-aria-label="common.manualLabel" data-i18n-title="common.manualLabel" aria-label="Wskazówki" title="Wskazówki"><i class="ico" data-icon="info"></i></button>
    </div>
    <div class="topbar-section topbar-section-4">
      <span class="who" id="who">—</span>
      <button class="btn" id="btnLogout" type="button" data-i18n="control.logout" data-i18n-icon="close">Wyloguj</button>
    </div>
  </header>

  <main class="wrap wide" data-skel-step>
    <div class="shell">
      <div class="control-tabs-card">
        <section class="main control-main-card">
          <div id="app"><!-- renderowane przez control/js/ui.js --></div>
        </section>
      </div>
    </div>

  <!-- Modal QR urządzeń z top bara -->
  <div class="overlay modal--sheet hidden" id="qrModalOverlay">
    <div class="modal uni-modal" role="dialog" aria-modal="true" aria-labelledby="qrModalTitle">
      <div class="uni-head">
        <div class="mTitle" id="qrModalTitle" data-i18n="control.qrModalTitle">Urządzenie</div>
        <button class="btn sm" id="qrModalClose" type="button" aria-label="Zamknij" data-i18n-aria-label="common.modal.closeLabel"><i class="ico" data-icon="close"></i></button>
      </div>

      <div class="uni-body">
        <div class="uni-qr" id="qrModalQrWrap">
          <img id="qrModalImg" alt="Kod QR" data-i18n-alt="control.qrModalImgAlt"/>
        </div>

        <div class="uni-code">
          <span class="uni-code-val" id="qrModalCodeVal">——————</span>
        </div>

        <div class="hint uni-hint" data-i18n="control.qrModalCodeHint">familiada.online → Podłącz urządzenie → wprowadź kod</div>
      </div>

      <div class="uni-foot modal-actions">
        <a class="btn sm hidden" id="qrModalOpen" target="_blank" rel="noopener" data-i18n="common.open" data-i18n-icon="display">Otwórz</a>
        <button class="btn sm gold" id="qrModalCopy" type="button" data-i18n="common.copy" data-i18n-icon="copy">Kopiuj</button>
      </div>
    </div>
  </div>

  <!-- Modal "Udostępnij urządzenie" — dokładnie jak dzisiejsze control.html,
       reużywa control/js/share-device.js bez zmian (patrz control/js/app.js). -->
  <div class="overlay modal--sheet" id="shareDeviceOverlay" hidden>
    <div class="modal share-uni shareModal" role="dialog" aria-modal="true" aria-labelledby="shareDeviceTitle" data-sheet-local-actions>
      <div class="uni-head">
        <div class="mTitle" id="shareDeviceTitle" data-i18n="control.shareDeviceModal.title">Udostępnij</div>
        <button class="btn sm" id="btnShareDeviceClose" type="button" aria-label="Zamknij" data-i18n-aria-label="common.modal.closeLabel"><i class="ico" data-icon="close"></i></button>
      </div>
      <div class="uni-body">
        <div class="hint uni-hint" data-i18n="control.shareDeviceModal.hint">Wpisz nazwę lub e-mail albo zaznacz znajomych.</div>
        <section class="shareSection shareSection--lookup">
          <div class="section-title" data-i18n="baseSharePanel.lookup">E-mail lub nazwa użytkownika</div>
          <div class="baseShareLookup">
            <input id="shareDeviceEmail" class="inp" type="text"
                   placeholder="Nazwa użytkownika lub e-mail..."
                   data-i18n-placeholder="bases.shareModal.placeholder"/>
            <button class="btn sm gold" id="btnShareDeviceAdd" type="button" data-i18n-title="control.shareDevice" data-i18n-aria-label="control.shareDevice" aria-label="Udostępnij"><i class="ico" data-icon="envelope-out" aria-hidden="true"></i><span class="only-desktop" data-i18n="control.shareDevice">Udostępnij</span></button>
          </div>
        </section>

        <section class="shareSection shareSection--friends">
          <div class="shareSectionHeading"><div class="section-title" data-i18n="contacts.sections.friend">Znajomi</div><div id="shareDeviceBulkActions"></div></div>
          <div id="shareDeviceSubsList" class="shareList shareList--scroll"></div>
        </section>

        <section id="shareDeviceCurrentWrap" class="shareSection shareSection--shared">
          <div class="section-title" data-i18n="control.shareDeviceModal.sectionShared">Udostępnione w tej sesji</div>
          <div id="shareDeviceCurrentContent" class="shareList"></div>
        </section>
      </div>
      <div class="uni-foot modal-actions">
        <button class="btn sm" id="btnShareDeviceCancel" type="button" data-i18n="common.cancel" data-i18n-icon="close">Anuluj</button>
        <button class="btn sm gold" id="btnShareDeviceFriends" type="button" disabled><i class="ico" data-icon="people" aria-hidden="true"></i><span id="shareDeviceFriendsLabel" class="shareSelectedFull">Udostępnij zaznaczonym</span><span id="shareDeviceFriendsShort" class="shareSelectedShort">Udostępnij</span></button>
      </div>
    </div>
  </div>


    <div class="footer">
      <div data-i18n="common.footer.left">© 2026 Familiada — system do gry na żywo</div>
      <button class="btn-contact-footer" type="button" data-contact-modal data-i18n="common.contactBtn">Kontakt</button>
    </div>
  </main>
  <script type="module" src="/shared/js/core/contact-modal.js?v=v2026-10-23T15275"></script>

</body>
</html>
