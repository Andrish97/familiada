<!DOCTYPE html>
<html lang="pl">
<head>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta name="app-version" content="v2026-10-09T22325"/>

  <meta charset="UTF-8"/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://supabase.familiada.online">
  <title data-i18n="polls.title">Familiada — ankieta i wyniki</title>

  <link rel="icon" href="/favicon.ico?v=v2026-10-09T22325"/>
  <link rel="stylesheet" href="/shared/css/base.css?v=v2026-10-09T22325"/>
  <link rel="stylesheet" href="/games/css/games.css?v=v2026-10-09T22325"/>
  <link rel="stylesheet" href="/shared/css/polls.css?v=v2026-10-09T22325"/>

  <script>
    document.documentElement.classList.add('page-loading');
    try {
      var _has = false;
      for (var _i = 0; _i < localStorage.length; _i++) {
        var _k = localStorage.key(_i);
        if (_k && _k.startsWith('sb-') && _k.endsWith('-auth-token')) { _has = true; break; }
      }
      if (!_has) location.replace('/login/');
    } catch(_e) {}
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="/shared/js/core/security-warning.js?v=v2026-10-09T22325" defer></script>
  <script type="module" src="/polls/js/polls.js?v=v2026-10-09T22325" defer></script>
  <script type="module" src="/shared/js/core/topbar-controller.js?v=v2026-10-09T22325" defer></script>
</head>

<body class="games-body polls-body topbar-title-mobile skel-body">
  <header class="topbar topbar-layout-4">
    <div class="topbar-section topbar-section-1">
      <div class="brand">FAMILIADA</div>
      <button class="btn" id="btnBack" type="button">Wstecz</button>
    </div>
    <div class="topbar-section topbar-section-2">
      <div class="topbar-title">
        <div class="title" data-i18n="polls.pageTitle">Ankieta</div>
        <div class="subtitle" id="pollGameName"></div>
      </div>
    </div>
    <div class="topbar-section topbar-section-3">
      <button class="btn" id="btnManual" type="button" data-i18n-aria-label="common.manualLabel" data-i18n-title="common.manualLabel" aria-label="Wskazówki" title="Wskazówki"><i class="ico" data-icon="info"></i></button>
    </div>
    <div class="topbar-section topbar-section-4">
      <span class="who" id="who">—</span>
      <button class="btn" id="btnLogout" type="button" data-i18n="common.authEntry">Zaloguj / Załóż konto</button>
    </div>
  </header>

  <main class="wrap">
    <!-- A. Pasek stanu: stan słowem po lewej, WSZYSTKIE akcje po prawej
         (telefon: stan u góry, akcje w dolnym pasku przyklejonym do ekranu) -->
    <div class="pollBar" id="pollBar" data-state="" style="display:none;">
      <div class="pollBarState">
        <span class="pollStateWord" id="pollStateWord"></span>
        <span class="pollStateInfo" id="pollStateInfo"></span>
        <span class="pollBarHint" id="hintTop"></span>
      </div>
      <div class="pollBarActions" id="pollActions">
        <button class="btn sm" id="btnResumePoll" type="button" hidden data-i18n="polls.actions.resumePoll">Wznów głosowanie</button>
        <button class="btn sm" id="btnLeaveTally" type="button" hidden data-i18n="polls.actions.leaveTally">Wyjdź z podliczania</button>
        <button class="btn sm gold" id="btnOpenPoll" type="button" hidden data-i18n="polls.actions.openPoll">Uruchom</button>
        <button class="btn sm gold" id="btnStopPoll" type="button" hidden data-i18n="polls.actions.stopPoll">Zatrzymaj</button>
        <button class="btn sm gold" id="btnTallyPoll" type="button" hidden data-i18n="polls.actions.tallyPoll">Podlicz głosy</button>
        <button class="btn sm gold" id="btnApproveTally" type="button" hidden data-i18n="polls.actions.approve">Zatwierdź</button>
        <button class="btn sm gold" id="btnReopenPoll" type="button" hidden data-i18n="polls.actions.reopenPoll">Uruchom ponownie</button>
        <button class="btn sm danger" id="btnAbort" type="button" hidden data-i18n="polls.actions.abort">Przerwij</button>
      </div>
    </div>

    <!-- B. Treść: wypustki Udostępnianie · Wyniki -->
    <section class="games-shell" id="cardMain" style="display:none;">
      <div class="tabs-card hub-tabs polls-tabs-card" id="pollTabsCard">
        <div class="tabs-strip" id="pollTabs" role="tablist">
          <div class="tab-slot slot-share active">
            <button class="tab-label active" id="tabShare" type="button" role="tab" aria-controls="secShare" aria-selected="true">
              <span data-i18n="polls.tabs.share">Udostępnianie</span>
            </button>
            <div class="tab-wrapper" aria-hidden="true">
              <div class="tab-active"></div>
              <div class="tab-corner tab-corner-left"></div>
              <div class="tab-corner tab-corner-right"></div>
            </div>
          </div>

          <div class="tab-slot slot-results">
            <button class="tab-label" id="tabResults" type="button" role="tab" aria-controls="secResults" aria-selected="false">
              <span data-i18n="polls.tabs.results">Wyniki</span>
            </button>
            <div class="tab-wrapper" aria-hidden="true">
              <div class="tab-active"></div>
              <div class="tab-corner tab-corner-left"></div>
              <div class="tab-corner tab-corner-right"></div>
            </div>
          </div>
        </div>

        <div class="card games-card polls-card">
          <!-- Udostępnianie -->
          <div class="polls-section active" id="secShare" role="tabpanel">
            <div class="pollsEmpty" id="shareEmpty"></div>
            <div class="shareCols" id="shareBody" style="display:none;">
              <section class="pollSec pollLinkSec">
                <h3 class="pollSecTitle" data-i18n="polls.share.linkTitle">Link</h3>
                <div class="pollLinkPlaceholder" id="linkPlaceholder" data-i18n="polls.share.linkAfterStart" hidden>Link pojawi się po uruchomieniu</div>
                <div class="pollLinkLive" id="linkLive">
                  <div class="pollQrStage">
                    <button class="qrBox img" id="qr" type="button" data-i18n-aria-label="polls.share.enlargeQr" data-i18n-title="polls.share.enlargeQr" aria-label="Powiększ kod QR" title="Powiększ kod QR"></button>
                    <div class="pollQrHint" data-i18n="polls.share.scanHint">Zeskanuj telefonem, żeby zagłosować</div>
                  </div>
                  <div class="linkField">
                    <input class="inp pollLinkInp" id="pollLink" readonly />
                    <button class="btn xs linkCopyBtn" id="btnCopy" type="button" disabled data-i18n-aria-label="polls.share.copyLink" data-i18n-title="polls.share.copyLink" aria-label="Kopiuj link" title="Kopiuj link"><i class="ico" data-icon="copy"></i></button>
                  </div>
                  <div class="pollLinkActions">
                    <button class="btn sm" id="btnOpen" type="button" disabled><i class="ico" data-icon="eye"></i><span data-i18n="polls.actions.openShort">Otwórz</span></button>
                    <button class="btn sm" id="btnOpenQr" type="button" disabled><i class="ico" data-icon="display"></i><span data-i18n="polls.actions.qrOnDisplay">QR na wyświetlaczu</span></button>
                  </div>
                </div>
              </section>

              <section class="pollSec pollSubsSec">
                <div class="pollSecHead">
                  <h3 class="pollSecTitle" data-i18n="polls.share.subsTitle">Subskrybenci</h3>
                  <span class="subsSummary" id="subsSummary"></span>
                </div>
                <div class="subsTools" id="subsTools">
                  <button class="btn xs" id="btnSelectAll" type="button" data-i18n="polls.share.selectAll">Zaznacz wszystkich</button>
                </div>
                <div class="pollsEmpty" id="subsEmpty" style="display:none;"></div>
                <div class="grid subsGrid" id="subsGrid"></div>
                <div class="subsFoot">
                  <span class="pollBarHint subsSendHint" id="sendHint"></span>
                  <button class="btn sm gold" id="btnSendInvites" type="button" disabled data-i18n="polls.share.sendInvites">Wyślij zaproszenia</button>
                </div>
              </section>
            </div>
          </div>

          <!-- Wyniki: na żywo / zatrzymane / podliczanie / ostateczne — te same wiersze -->
          <div class="polls-section" id="secResults" role="tabpanel">
            <div class="meta" id="resultsMeta"></div>
            <div class="tallyBar" id="tallyBar" hidden>
              <div class="tallyHint" id="tallyHint"></div>
              <div class="tallyTools" id="tallyTools">
                <span class="tallySave" id="tallySave" role="status"></span>
                <button class="btn sm" id="btnUndo" type="button" disabled data-i18n-title="polls.tally.undo" data-i18n-aria-label="polls.tally.undo" title="Cofnij" aria-label="Cofnij"><i class="ico" data-icon="undo"></i></button>
                <button class="btn sm" id="btnRedo" type="button" disabled data-i18n-title="polls.tally.redo" data-i18n-aria-label="polls.tally.redo" title="Ponów" aria-label="Ponów"><i class="ico" data-icon="redo"></i></button>
              </div>
            </div>
            <div id="resultsList"></div>
          </div>
        </div>
      </div>
    </section>

    <div class="card" id="cardEmpty" style="display:none;">
      <div class="name" data-i18n="polls.empty.title">Brak gry</div>
      <div class="meta" data-i18n-html="polls.empty.meta">Otwórz stronę z parametrem <b>polls?id=...</b>.</div>
    </div>
    <!-- Okno QR: kod wyświetlacza albo powiększony kod do głosowania (.uni-modal; na telefonie arkusz) -->
    <div class="overlay modal--sheet hidden" id="pollQrModalOverlay">
      <div class="modal uni-modal" role="dialog" aria-modal="true" aria-labelledby="pollQrModalTitle">
        <div class="uni-head">
          <div class="mTitle" id="pollQrModalTitle" data-i18n="polls.qrModal.title">Wyświetlacz QR</div>
          <button class="btn sm" id="pollQrModalClose" type="button" aria-label="Zamknij" data-i18n-aria-label="common.modal.closeLabel"><i class="ico" data-icon="close"></i></button>
        </div>
        <div class="uni-body">
          <div class="uni-hint" id="pollQrModalSubtitle" data-i18n="polls.qrModal.subtitle">Kod do podłączenia wyświetlacza — nie do głosowania</div>
          <div class="pollQrVote" id="pollQrModalVote" hidden></div>
          <div class="uni-code" id="pollQrModalCode">
            <span class="uni-code-val" id="pollQrModalCodeVal">——————</span>
          </div>
          <div class="uni-hint" id="pollQrModalHint" data-i18n="polls.qrModal.hint">Wejdź na familiada.online → Podłącz urządzenie → wprowadź kod</div>
        </div>
        <div class="uni-foot modal-actions" id="pollQrModalActions">
          <button class="btn sm" id="pollQrModalOpen" type="button" data-i18n="polls.qrModal.openBtn">Otwórz</button>
          <button class="btn sm gold" id="pollQrModalCopy" type="button" data-i18n="polls.qrModal.copyBtn">Kopiuj</button>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
