<!DOCTYPE html>
<html lang="pl">
<head>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta name="app-version" content="v2026-10-08T22465"/>

  <meta charset="UTF-8"/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://supabase.familiada.online">
  <title data-i18n="polls.title">Familiada — ankieta i wyniki</title>

  <link rel="icon" href="/favicon.ico?v=v2026-10-08T22465"/>
  <link rel="stylesheet" href="/shared/css/base.css?v=v2026-10-08T22465"/>
  <link rel="stylesheet" href="/games/css/games.css?v=v2026-10-08T22465"/>
  <link rel="stylesheet" href="/shared/css/polls.css?v=v2026-10-08T22465"/>

  <script>
    document.documentElement.classList.add('page-loading');
    try {
      var _has = false;
      for (var _i = 0; _i < localStorage.length; _i++) {
        var _k = localStorage.key(_i);
        if (_k && _k.startsWith('sb-') && _k.endsWith('-auth-token')) { _has = true; break; }
      }
      if (!_has) location.replace('/login/');
    } catch(_e) {}
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="/shared/js/core/security-warning.js?v=v2026-10-08T22465" defer></script>
  <script type="module" src="/polls/js/polls.js?v=v2026-10-08T22465" defer></script>
  <script type="module" src="/shared/js/core/topbar-controller.js?v=v2026-10-08T22465" defer></script>
</head>

<body class="games-body polls-body skel-body">
  <header class="topbar topbar-layout-4">
    <div class="topbar-section topbar-section-1">
      <div class="brand">FAMILIADA</div>
      <button class="btn" id="btnBack" type="button" data-i18n="polls.backToGames" data-i18n-icon="arrow-left">Moje gry</button>
    </div>
    <div class="topbar-section topbar-section-2">
      <div class="topbar-title">
        <div class="title" data-i18n="polls.pageTitle">Ankieta</div>
        <div class="subtitle" id="pollGameName"></div>
      </div>
    </div>
    <div class="topbar-section topbar-section-3">
      <button class="btn" id="btnManual" type="button" data-i18n-aria-label="common.manualLabel" data-i18n-title="common.manualLabel" aria-label="Wskazówki" title="Wskazówki"><i class="ico" data-icon="info"></i></button>
    </div>
    <div class="topbar-section topbar-section-4">
      <span class="who" id="who">—</span>
      <button class="btn" id="btnLogout" type="button" data-i18n="common.authEntry">Zaloguj / Załóż konto</button>
    </div>
  </header>

  <main class="wrap">
    <!-- A. Pasek stanu: oznaczenia po lewej, przyciski stanu po prawej -->
    <div class="pollBar" id="pollBar" style="display:none;">
      <div class="pollBarTags">
        <span class="tag tag--gold" id="chipType"></span>
        <span class="tag" id="chipStatus"></span>
        <span class="tag tag--info" id="chipVotes" style="display:none;"></span>
      </div>
      <div class="pollBarActions">
        <!-- tylko powód, dla którego „Zamknij” jest wyłączone -->
        <span class="pollBarHint" id="hintTop"></span>
        <button class="btn sm gold" id="btnPollAction" type="button" style="visibility:hidden"></button>
        <button class="btn sm" id="btnAbort" type="button" style="display:none;" data-i18n="polls.actions.abort">Przerwij</button>
        <button class="btn sm" id="btnCancelTextCloseTop" type="button" style="display:none;" data-i18n="polls.actions.cancel">Anuluj</button>
      </div>
    </div>

    <!-- B. Treść: wypustki Udostępnianie · Wyniki -->
    <section class="games-shell" id="cardMain" style="display:none;">
      <div class="tabs-card hub-tabs polls-tabs-card" id="pollTabsCard">
        <div class="tabs-strip" id="pollTabs" role="tablist">
          <div class="tab-slot slot-share active">
            <button class="tab-label active" id="tabShare" type="button" role="tab" aria-controls="secShare" aria-selected="true">
              <span data-i18n="polls.tabs.share">Udostępnianie</span>
            </button>
            <div class="tab-wrapper" aria-hidden="true">
              <div class="tab-active"></div>
              <div class="tab-corner tab-corner-left"></div>
              <div class="tab-corner tab-corner-right"></div>
            </div>
          </div>

          <div class="tab-slot slot-results">
            <button class="tab-label" id="tabResults" type="button" role="tab" aria-controls="secResults" aria-selected="false">
              <span data-i18n="polls.tabs.results">Wyniki</span>
            </button>
            <div class="tab-wrapper" aria-hidden="true">
              <div class="tab-active"></div>
              <div class="tab-corner tab-corner-left"></div>
              <div class="tab-corner tab-corner-right"></div>
            </div>
          </div>
        </div>

        <div class="card games-card polls-card">
          <!-- Udostępnianie -->
          <div class="polls-section active" id="secShare" role="tabpanel">
            <div class="pollsEmpty" id="shareEmpty"></div>
            <div class="shareCols" id="shareBody" style="display:none;">
              <section class="pollSec pollLinkSec">
                <h3 class="pollSecTitle" data-i18n="polls.share.linkTitle">Link i QR</h3>
                <div class="qrBox img" id="qr"></div>
                <input class="inp pollLinkInp" id="pollLink" readonly />
                <div class="pollLinkActions">
                  <button class="btn sm" id="btnCopy" type="button" disabled data-i18n="polls.actions.copyShort">Kopiuj</button>
                  <button class="btn sm gold" id="btnOpen" type="button" disabled data-i18n="polls.actions.openShort">Otwórz</button>
                  <button class="btn sm" id="btnOpenQr" type="button" disabled data-i18n="polls.actions.qrOnDisplay">QR na wyświetlaczu</button>
                </div>
              </section>

              <section class="pollSec pollSubsSec">
                <div class="pollSecHead">
                  <h3 class="pollSecTitle" data-i18n="polls.share.subsTitle">Subskrybenci</h3>
                  <button class="btn sm gold" id="btnSendInvites" type="button" disabled data-i18n="polls.share.sendInvites">Wyślij zaproszenia</button>
                </div>
                <div class="pollsEmpty" id="subsEmpty" style="display:none;"></div>
                <div class="grid subsGrid" id="subsGrid"></div>
              </section>
            </div>
          </div>

          <!-- Wyniki -->
          <div class="polls-section" id="secResults" role="tabpanel">
            <div class="meta" id="resultsMeta"></div>
            <div id="resultsList"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- C. Zamykanie ankiety tekstowej: okno scalania zamiast treści (B) -->
    <section class="games-shell" id="textCloseShell" style="display:none;">
      <div class="card games-card" id="textCloseCard">
        <div class="name" style="display:flex; justify-content:space-between; align-items:center;">
          <span data-i18n="polls.textClose.title">Zamykanie — edycja odpowiedzi</span>
          <div class="tcHistoryTools">
            <button class="btn sm" id="btnUndo" type="button" title="Cofnij" aria-label="Cofnij" disabled><i class="ico" data-icon="undo"></i></button>
            <button class="btn sm" id="btnRedo" type="button" title="Ponów" aria-label="Ponów" disabled><i class="ico" data-icon="redo"></i></button>
          </div>
        </div>
        <div class="meta" id="textCloseMeta">—</div>
        <div id="textCloseList" style="margin-top:10px; display:grid; gap:12px;"></div>

        <div class="row" style="margin-top:12px;">
          <button class="btn sm" id="btnCancelTextClose" type="button" data-i18n="polls.actions.cancel">Anuluj</button>
          <button class="btn sm gold" id="btnFinishTextClose" type="button" data-i18n="polls.actions.closeAndNormalize">Zamknij i przelicz</button>
        </div>
      </div>
    </section>

    <div class="card" id="cardEmpty" style="display:none;">
      <div class="name" data-i18n="polls.empty.title">Brak gry</div>
      <div class="meta" data-i18n-html="polls.empty.meta">Otwórz stronę z parametrem <b>polls?id=...</b>.</div>
    </div>

    <div class="pollToast" id="msg" role="status" aria-live="polite"></div>
  </main>

  <!-- Modal QR wyświetlacza ankiety -->
  <div class="qrModalOverlay hidden" id="pollQrModalOverlay">
    <div class="qrModalBox">
      <div class="qrModalHead">
        <div class="qrModalTitle" id="pollQrModalTitle" data-i18n="polls.qrModal.title">Wyświetlacz QR</div>
        <button class="btn xs" id="pollQrModalClose" type="button" aria-label="Zamknij" data-i18n-aria-label="common.modal.closeLabel"><i class="ico" data-icon="close"></i></button>
      </div>
      <div class="qrModalSubtitle" data-i18n="polls.qrModal.subtitle">Kod do podłączenia wyświetlacza — nie do głosowania</div>
      <div class="qrModalBody">
        <div class="qrModalCode">
          <span class="qrModalCodeVal" id="pollQrModalCodeVal">——————</span>
        </div>
        <div class="qrModalActions">
          <button class="btn gold" id="pollQrModalCopy" type="button" data-i18n="polls.qrModal.copyBtn">Kopiuj</button>
          <button class="btn" id="pollQrModalOpen" type="button" data-i18n="polls.qrModal.openBtn">Otwórz</button>
        </div>
        <div class="qrModalCodeHint" data-i18n="polls.qrModal.hint">Wejdź na familiada.online → Podłącz urządzenie → wprowadź kod</div>
      </div>
    </div>
  </div>
</body>
</html>
