<!DOCTYPE html>
<html lang="pl">
<head>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta name="app-version" content="v2026-10-13T10250"/>

  <meta charset="UTF-8"/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://supabase.familiada.online">
  <title data-i18n="contacts.friends.title">Familiada — friends</title>

  <link rel="icon" href="/favicon.ico?v=v2026-10-13T10250"/>
  <link rel="stylesheet" href="/shared/css/base.css?v=v2026-10-13T10250"/>
  <link rel="stylesheet" href="/games/css/games.css?v=v2026-10-13T10250"/>
  <link rel="stylesheet" href="/shared/css/contacts.css?v=v2026-10-13T10250"/>
  <script>
    document.documentElement.classList.add('page-loading');
    try {
      var _has = false;
      for (var _i = 0; _i < localStorage.length; _i++) {
        var _k = localStorage.key(_i);
        if (_k && _k.startsWith('sb-') && _k.endsWith('-auth-token')) { _has = true; break; }
      }
      if (!_has) location.replace('/login/');
    } catch(_e) {}
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script type="module" src="/friends/js/friends.js?v=v2026-10-13T10250" defer></script>
  <script type="module" src="/shared/js/core/topbar-controller.js?v=v2026-10-13T10250" defer></script>
  <script src="/shared/js/core/security-warning.js?v=v2026-10-13T10250" defer></script>
</head>

<body class="contacts-body skel-body">
  <header class="topbar topbar-layout-4">
    <div class="topbar-section topbar-section-1">
      <div class="brand">FAMILIADA</div>
      <button class="btn" id="btnBack" type="button">Wstecz</button>
    </div>
    <div class="topbar-section topbar-section-2">
      <button class="btn" id="btnSubscribers" type="button" data-nav-hidden="true" style="display:none;"><span data-i18n="games.nav.subscribers" data-i18n-icon-after="envelope">Subskrybenci</span></button>
    </div>
    <div class="topbar-section topbar-section-3">
      <button class="btn" id="btnManual" type="button" data-i18n-aria-label="common.manualLabel" data-i18n-title="common.manualLabel" aria-label="Wskazówki" title="Wskazówki"><i class="ico" data-icon="info"></i></button>
    </div>
    <div class="topbar-section topbar-section-4">
      <span class="who" id="who">—</span>
      <button class="btn" id="btnLogout" type="button" data-i18n="common.authEntry">Zaloguj / Załóż konto</button>
    </div>
  </header>

  <main class="wrap">
    <div class="bar">
      <div>
        <div class="title" data-i18n="contacts.friends.title">Znajomi</div>
        <div class="hint" id="hint" data-i18n="contacts.friends.hint"></div>
      </div>
    </div>

    <div class="tabs-card contacts-tabs">
      <div class="tabs-strip" id="contactsTabs" role="tablist">
        <div class="tab-slot">
          <button class="tab-label" id="contactsTabInvite" type="button" role="tab" data-contact-tab="invite" aria-controls="contactsInvite"><span data-i18n="contacts.tabs.invite"></span><span class="badge" data-contact-count="invite"></span></button>
          <div class="tab-wrapper" aria-hidden="true"><div class="tab-active"></div><div class="tab-corner tab-corner-left"></div><div class="tab-corner tab-corner-right"></div></div>
        </div>
        <div class="tab-slot">
          <button class="tab-label" id="contactsTabReceived" type="button" role="tab" data-contact-tab="received" aria-controls="contactsReceived"><span data-i18n="contacts.friends.title"></span><span class="badge" data-contact-count="received"></span></button>
          <div class="tab-wrapper" aria-hidden="true"><div class="tab-active"></div><div class="tab-corner tab-corner-left"></div><div class="tab-corner tab-corner-right"></div></div>
        </div>
      </div>
      <div class="card" id="contactsLoadState" role="status" aria-live="polite">
        <div class="name" id="contactsLoadMessage" data-i18n="contacts.load.loading">Wczytuję kontakty…</div>
        <button class="btn sm" id="contactsLoadRetry" type="button" data-i18n="contacts.load.retry" hidden>Ponów</button>
      </div>
      <div class="contacts-layout" id="contactsHost" data-skel-step>
      <div class="card contacts-card" id="contactsInvite" data-contact-panel="invite">
        <section class="shareSection contacts-add">
          <h2 class="shareSectionTitle" data-i18n="contacts.friends.add"></h2>
          <form id="inviteForm" class="contacts-invite">
            <label class="shareSectionSub" for="inviteInput" data-i18n="contacts.handle"></label>
            <div class="contacts-invite-row">
              <input class="inp" id="inviteInput" type="text" required autocomplete="off" data-i18n-placeholder="contacts.handle"/>
              <button class="btn sm gold" id="btnInvite" type="submit" data-i18n="contacts.invite">+ Zaproś</button>
            </div>
          </form>
        </section>
        <div id="contactsOutgoing"></div>
      </div>
      <div class="card contacts-card" id="contactsReceived" data-contact-panel="received"></div>
    </div>

    </div>

    <div class="footer">
      <div data-i18n="common.footer.left">© 2026 Familiada — system do gry na żywo</div>
      <button class="btn-contact-footer" type="button" data-contact-modal data-i18n="common.contactBtn">Kontakt</button>
    </div>
  </main>
  <script type="module" src="/shared/js/core/contact-modal.js?v=v2026-10-13T10250"></script>
</body>
</html>
