<!DOCTYPE html>
<html lang="pl">
<head>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta name="app-version" content="v2026-10-26T00083"/>


  <meta charset="UTF-8"/>
  <meta name="i18n-parts" content="logos resources">
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"/>
  <script src="/shared/js/core/page-boot.js?v=v2026-10-26T00083"></script>
  <link rel="preconnect" href="https://supabase.familiada.online">
  <title data-i18n="logoEditor.titles.draw">Familiada — edytor logo</title>

  <link rel="icon" href="/favicon.ico?v=v2026-10-26T00083"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/icon-apple-touch-180.png?v=v2026-10-26T00083"/>
  <link rel="manifest" href="/manifest.json?v=v2026-10-26T00083"/>
  <meta name="theme-color" content="#050914"/>
  <link rel="stylesheet" href="/shared/css/blocking-overlay.css?v=v2026-10-26T00083" />
  <link rel="stylesheet" href="/shared/style/tokens.css?v=v2026-10-26T00083"/>
  <link rel="stylesheet" href="/shared/style/base.css?v=v2026-10-26T00083"/>
  <link rel="stylesheet" href="/shared/style/components.css?v=v2026-10-26T00083"/>
  <link rel="stylesheet" href="/shared/style/layout.css?v=v2026-10-26T00083"/>
  <link rel="stylesheet" href="/shared/style/utilities.css?v=v2026-10-26T00083"/>
  <link rel="stylesheet" href="/logos/css/logo.css?v=v2026-10-26T00083"/>
  <script type="module" src="/shared/js/core/device-attrs.js?v=v2026-10-26T00083"></script>

  <script>document.documentElement.classList.add('page-loading')</script>

  <script src="/shared/vendor/supabase-js.js?v=v2026-10-26T00083" defer></script>

  <!-- Fix Fabric.js 5.x bug: uses 'alphabetical' instead of 'alphabetic' -->
  <script>
  (function(){
    var d = Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype, 'textBaseline');
    if (d && d.set) Object.defineProperty(CanvasRenderingContext2D.prototype, 'textBaseline', {
      get: d.get,
      set: function(v) { d.set.call(this, v === 'alphabetical' ? 'alphabetic' : v); },
      configurable: true
    });
  })();
  </script>
  <!-- Fabric.js (global: window.fabric) -->
  <script src="/shared/vendor/fabric.min.js?v=v2026-10-26T00083"></script>

  <script type="module" src="/logos/js/editor-draw.js?v=v2026-10-26T00083" defer></script>
  <script src="/shared/js/core/security-warning.js?v=v2026-10-26T00083" defer></script>

</head>

<!-- Edytor logo (DRAW) — osobna strona /logos/editor/draw/?id=<logo>. Zmiany
     zapisują się same (bez przycisku „Zapisz” i bez pytań przy wyjściu),
     wspólna logika: /logos/js/editor-page.js. -->
<body class="page-fit logo-body is-editor skel-body topbar-title-mobile">
  <header class="topbar topbar-layout-4">
    <div class="topbar-section topbar-section-1">
      <div class="brand">FAMILIADA</div>
      <button class="btn" id="btnBack" type="button" data-i18n-icon="arrow-left">Wstecz</button>
    </div>
    <div class="topbar-section topbar-section-2">
      <div class="topbar-title"><div class="title" data-i18n="logoEditor.editor.editLogoPrefix">Edytor logo</div><div class="subtitle" id="brandTitle"></div></div>
    </div>
    <div class="topbar-section topbar-section-3">
      <button class="btn" id="btnManual" type="button" data-i18n-aria-label="common.manualLabel" data-i18n-title="common.manualLabel" aria-label="Wskazówki" title="Wskazówki"><i class="ico" data-icon="info"></i></button>
    </div>
    <div class="topbar-section topbar-section-4">
      <span class="who" id="who"></span>
      <button class="btn" id="btnLogout" type="button" data-i18n="common.authEntry" data-i18n-icon="person">Zaloguj / Załóż konto</button>
    </div>
  </header>

  <main class="wrap logoWrap" data-skel-step>
    <section class="editorShell" id="editorShell" data-mode="DRAW">
      <!-- pole nazwy (wspólne z edytorem gier: .name-field w base.css);
           #saveStatus ukryty — tylko punkt zaczepienia testów, bez informacji
           o zapisie na stronie -->
      <div class="name-field">
        <label class="name-field-label" for="logoName" data-i18n="common.nameLabel">Nazwa</label>
        <input class="inp" id="logoName" placeholder="Np. Moje logo" maxlength="80" data-i18n-placeholder="logoEditor.editor.namePlaceholder" disabled/>
        <span id="saveStatus" data-state="idle" hidden></span>
      </div>

      <div class="card games-card editorCard">
        <div class="editorToolbar" id="editorToolbar">
          <!-- TOOLBAR dla DRAW -->
          <div class="toolRow" id="toolsDraw">

            <!-- Rząd 1: narzędzia -->
            <div class="toolGrid">
              <button class="btn icon" id="tSelect"   type="button" data-tip-pos="top" data-tip=""></button>
              <button class="btn icon" id="tPan"      type="button" data-tip-pos="top" data-tip=""></button>
              <button class="btn icon" id="tZoomIn"   type="button" data-tip-pos="top" data-tip=""></button>
              <button class="btn icon" id="tZoomOut"  type="button" data-tip-pos="top" data-tip=""></button>
              <button class="btn icon" id="tBg"       type="button" data-tip-pos="top" data-tip=""></button>
            </div>

            <div class="toolSep"></div>

            <div class="toolGrid">
              <button class="btn icon" id="tBrush"    type="button" data-tip-pos="top" data-tip=""></button>
              <button class="btn icon" id="tEraser"   type="button" data-tip-pos="top" data-tip=""></button>
              <button class="btn icon" id="tShapes"   type="button" data-tip-pos="top" data-tip=""></button>
              <button class="btn icon" id="tText"     type="button" data-tip-pos="top" data-tip=""></button>
            </div>

            <div class="toolSep"></div>

            <div class="toolGrid">
              <button class="btn icon" id="tUndo"     type="button" data-tip-pos="top" data-tip=""></button>
              <button class="btn icon" id="tRedo"     type="button" data-tip-pos="top" data-tip=""></button>
              <button class="btn icon" id="tDuplicate" type="button" data-tip-pos="top" data-tip=""></button>
              <button class="btn icon danger" id="tClear" type="button" data-tip-pos="top" data-tip=""></button>
              <button class="btn icon" id="tEye"      type="button" data-tip-pos="top" data-tip=""></button>
            </div>

            <!-- Separator poziomy między toolbarem a ustawieniami -->
            <div class="toolRowSep"></div>

            <!-- Rząd 2: kontekstowe ustawienia -->
            <div class="toolCtx" id="toolCtxSettings"></div>

          </div>
        </div><!-- /editorToolbar -->

        <div class="editorContent">
          <!-- DRAW: scena + kontekstowe ustawienia -->
          <div class="pane" id="paneDraw">
            <!-- Kontekstowe ustawienia narzędzia/obiektu -->
            <div class="drawSettings" id="drawSettings"></div>
            <!-- Canvas -->
            <div class="drawStageWrap">
              <div class="drawStageRatio" id="drawStageHost">
                <canvas id="drawStage" width="1" height="1"></canvas>
              </div>
            </div>
            <!-- Font picker popover (shared by text tool settings) -->
            <div id="drawFontPickPop" class="fontPickPop" hidden>
              <div class="fontPickPanel ctxPop">
                <div class="fontPickSearch">
                  <input id="drawFontSearchInp" class="inp" type="text" placeholder="Szukaj fontu…" data-i18n-placeholder="logoEditor.draw.ui.fontSearchPlaceholder">
                  <button id="drawFontSearchClear" class="btn sm" type="button" aria-label="Wyczyść" data-i18n-aria-label="common.clear"><i class="ico" data-icon="close"></i></button>
                </div>
                <div id="drawFontList" class="fontPickList"></div>
                <div id="drawFontEmpty" class="fontPickEmpty" hidden data-i18n="logoEditor.draw.ui.fontNoResults">Brak wyników</div>
              </div>
            </div>
          </div>
        </div><!-- /editorContent -->
      </div><!-- /editorCard -->
    </section>

    <!-- Fullscreen preview (MODAL z X) -->
    <div class="overlay modal--sheet" id="previewOverlay" hidden>
      <div class="modal previewModal">
        <div class="previewModalTitle">
          <div>
            <div class="mTitle" data-i18n="logoEditor.preview.title">Podgląd</div>
            <div class="mSub" data-i18n="logoEditor.preview.subtitle">Tak będzie wyglądać logo na wyświetlaczu</div>
          </div>
          <button class="btn sm" id="btnPreviewClose" type="button" aria-label="Zamknij" data-i18n-aria-label="common.modal.closeLabel"><i class="ico" data-icon="close"></i></button>
        </div>
        <div class="previewModalCanvas">
          <canvas id="bigPreviewFull" width="1600" height="700"></canvas>
        </div>
      </div>
    </div>

    <div class="footer">
      <div data-i18n="common.footer.left">© 2026 Familiada — system do gry na żywo</div>
      <button class="btn-contact-footer" type="button" data-contact-modal data-i18n="common.contactBtn">Kontakt</button>
    </div>
  </main>

  <script type="module" src="/shared/js/core/contact-modal.js?v=v2026-10-26T00083"></script>
  <script type="module" src="/shared/js/core/topbar-controller.js?v=v2026-10-26T00083"></script>

</body>
</html>
