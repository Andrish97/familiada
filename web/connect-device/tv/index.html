<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Familiada — Podłącz wyświetlacz</title>
  <link rel="stylesheet" href="/connect-device/tv/css/tv.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script type="module" src="/connect-device/tv/js/tv.js"></script>
</head>
<body>
  <main>
    <h1>Podłącz wyświetlacz</h1>
    <form id="tvConnectForm">
      <label for="tvCode">Wpisz kod z panelu sterowania</label>
      <input id="tvCode" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" autofocus required aria-describedby="tvMessage">
      <button id="tvConnect" type="submit">Podłącz</button>
      <p id="tvMessage" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
