<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <filter id="rough" x="-3%" y="-15%" width="106%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.055 0.11" numOctaves="2" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="#fff"/>
  <text x="600" y="405" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="126" font-weight="900" fill="#ffcc00" stroke="#aa8800" stroke-width="14" paint-order="stroke" filter="url(#rough)">FAMILIADA</text>
  <text x="600" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#4c4c4c">Przykład z celowo nierówną krawędzią obiektu</text>
</svg>
