<!DOCTYPE html>
<html lang="pl">
<head>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta name="app-version" content="v2026-10-10T06103"/>

  <meta charset="UTF-8"/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://supabase.familiada.online">
  <title data-i18n="pollsHubSubscriptions.title">Familiada — subskrypcje</title>

  <link rel="icon" href="/favicon.ico?v=v2026-10-10T06103"/>
  <link rel="stylesheet" href="/shared/css/base.css?v=v2026-10-10T06103"/>
  <link rel="stylesheet" href="/games/css/games.css?v=v2026-10-10T06103"/>
  <link rel="stylesheet" href="/subscriptions/css/subscriptions.css?v=v2026-10-10T06103"/>
  <script>
    document.documentElement.classList.add('page-loading');
    try {
      var _has = false;
      for (var _i = 0; _i < localStorage.length; _i++) {
        var _k = localStorage.key(_i);
        if (_k && _k.startsWith('sb-') && _k.endsWith('-auth-token')) { _has = true; break; }
      }
      if (!_has) location.replace('/login/');
    } catch(_e) {}
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script type="module" src="/subscriptions/js/subscriptions.js?v=v2026-10-10T06103" defer></script>
  <script type="module" src="/shared/js/core/topbar-controller.js?v=v2026-10-10T06103" defer></script>
  <script src="/shared/js/core/security-warning.js?v=v2026-10-10T06103" defer></script>
</head>

<body class="games-body skel-body">
  <header class="topbar topbar-layout-4">
    <div class="topbar-section topbar-section-1">
      <div class="brand">FAMILIADA</div>
      <button class="btn" id="btnBackToGames" type="button">Wstecz</button>
    </div>
    <div class="topbar-section topbar-section-2"></div>
    <div class="topbar-section topbar-section-3">
      <button class="btn" id="btnManual" type="button" data-i18n-aria-label="common.manualLabel" data-i18n-title="common.manualLabel" aria-label="Wskazówki" title="Wskazówki"><i class="ico" data-icon="info"></i></button>
    </div>
    <div class="topbar-section topbar-section-4">
      <span class="who" id="who">—</span>
      <button class="btn" id="btnLogout" type="button" data-i18n="common.authEntry">Zaloguj / Załóż konto</button>
    </div>
  </header>

  <main class="wrap">
    <div class="bar">
      <div>
        <div class="title" data-i18n="pollsHubSubscriptions.bar.title">Subskrypcje</div>
        <div class="hint" id="hint" data-i18n="pollsHubSubscriptions.bar.hintSubscribers">Naciśnij kafelek, żeby go zaznaczyć.</div>
      </div>

      <div class="actions">
        <button class="btn sm gold" id="btnResend" type="button" disabled data-for="subscribers" data-i18n="pollsHubSubscriptions.actions.resendLong">Ponów zaproszenie</button>
        <button class="btn sm gold" id="btnAccept" type="button" disabled data-for="subscriptions" hidden data-i18n="pollsHubSubscriptions.actions.accept">Akceptuj</button>
        <button class="btn sm gold" id="btnVote" type="button" disabled data-for="tasks" hidden data-i18n="pollsHubSubscriptions.actions.vote">Głosuj</button>
      </div>
    </div>

    <section class="games-shell">
      <div class="tabs-card hub-tabs subs-tabs-card" id="subsTabsCard">
        <div class="tabs-strip" id="subsTabs" role="tablist">
          <div class="tab-slot slot-subscribers active">
            <button class="tab-label" id="tabSubscribers" type="button" role="tab" aria-controls="subsSectionSubscribers" aria-selected="true">
              <span class="only-desktop" data-i18n="pollsHubSubscriptions.tab.subscribers">X</span><span class="only-mobile" data-i18n="pollsHubSubscriptions.tab.subscribersShort">X</span>
              
            </button>
            <div class="tab-wrapper" aria-hidden="true">
              <div class="tab-active"></div>
              <div class="tab-corner tab-corner-left"></div>
              <div class="tab-corner tab-corner-right"></div>
            </div>
          </div>
          <div class="tab-slot slot-subscriptions">
            <button class="tab-label" id="tabSubscriptions" type="button" role="tab" aria-controls="subsSectionSubscriptions" aria-selected="false">
              <span class="only-desktop" data-i18n="pollsHubSubscriptions.tab.subscriptions">X</span><span class="only-mobile" data-i18n="pollsHubSubscriptions.tab.subscriptionsShort">X</span>
              <span class="badge" id="subsBadge" aria-hidden="true"></span>
            </button>
            <div class="tab-wrapper" aria-hidden="true">
              <div class="tab-active"></div>
              <div class="tab-corner tab-corner-left"></div>
              <div class="tab-corner tab-corner-right"></div>
            </div>
          </div>
          <div class="tab-slot slot-tasks">
            <button class="tab-label" id="tabTasks" type="button" role="tab" aria-controls="subsSectionTasks" aria-selected="false">
              <span data-i18n="pollsHubSubscriptions.tab.tasks">X</span>
              <span class="badge" id="tasksBadge" aria-hidden="true"></span>
            </button>
            <div class="tab-wrapper" aria-hidden="true">
              <div class="tab-active"></div>
              <div class="tab-corner tab-corner-left"></div>
              <div class="tab-corner tab-corner-right"></div>
            </div>
          </div>
        </div>

        <div class="card games-card subs-card">
          <div class="subs-layout">
            <div class="subs-section active" id="subsSectionSubscribers" role="tabpanel" data-skel-step>
              <div class="grid" id="subscribersGrid"></div>
            </div>
            <div class="subs-section" id="subsSectionSubscriptions" role="tabpanel" data-skel-step>
              <div class="grid" id="subscriptionsGrid"></div>
            </div>
            <div class="subs-section" id="subsSectionTasks" role="tabpanel" data-skel-step>
              <div class="grid" id="tasksGrid"></div>
            </div>
          </div>

          <div class="games-bottom">
            <div class="games-bottom-left"></div>
            <div class="games-bottom-right"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Modal: nowy subskrybent -->
    <div class="overlay modal--sheet" id="inviteOverlay" style="display:none;">
      <div class="modal">
        <div class="mHead">
          <div class="mTitle" data-i18n="pollsHubSubscriptions.inviteModal.title">Nowy subskrybent</div>
          <button class="btn sm" id="btnInviteClose" type="button" aria-label="Zamknij" data-i18n-aria-label="common.modal.closeLabel"><i class="ico" data-icon="close"></i></button>
        </div>
        <div class="mSub" data-i18n="pollsHubSubscriptions.inviteModal.sub">Podaj e-mail lub nazwę użytkownika. Wyślemy zaproszenie do subskrypcji.</div>

        <div class="importRow">
          <input id="inviteInput" class="inp" type="text" maxlength="200" autocomplete="off" placeholder="E-mail lub nazwa użytkownika" data-i18n-placeholder="pollsHubSubscriptions.invite.placeholder"/>
        </div>

        <div class="importRow modal-actions">
          <button class="btn sm" id="btnInviteCancel" type="button" data-i18n="pollsHubSubscriptions.inviteModal.cancel">Anuluj</button>
          <button class="btn sm gold" id="btnInviteOk" type="button" data-i18n="pollsHubSubscriptions.invite.button">Zaproś</button>
        </div>
      </div>
    </div>

    <div class="footer">
      <div data-i18n="common.footer.left">© 2026 Familiada — system do gry na żywo</div>
      <button class="btn-contact-footer" type="button" data-contact-modal data-i18n="common.contactBtn">Kontakt</button>
    </div>
  </main>

  <div class="overlay" id="progressOverlay" style="display:none;"><div class="modal"><div class="mTitle" data-i18n="pollsHubSubscriptions.progress.title">Przetwarzanie</div><div class="mSub" data-i18n="pollsHubSubscriptions.progress.subtitle">Proszę czekać…</div><div style="margin-top:12px;gap:10px"><div class="importRow" style="align-items:center"><div id="progressStep" style="font-weight:800;letter-spacing:.04em">—</div><div id="progressCount" style="margin-left:auto;opacity:.8">0/0</div></div><div style="height:10px;border-radius:999px;background:rgba(255,255,255,.10);overflow:hidden"><div id="progressBar" style="height:100%;width:0%;background:rgba(255,255,255,.85)"></div></div><div class="importMsg" id="progressMsg" style="min-height:18px"></div></div></div></div>
</body>
</html>
