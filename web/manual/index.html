<!DOCTYPE html>
<html lang="pl">
<head>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta name="app-version" content="v2026-10-21T14343"/>


  <meta charset="UTF-8" />
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://supabase.familiada.online">
  <meta name="robots" content="noindex, nofollow" />
  <title data-i18n="manual.title">Familiada — wskazówki</title>

  <link rel="icon" href="/favicon.ico?v=v2026-10-21T14343" />

  <link rel="stylesheet" href="/shared/css/blocking-overlay.css?v=v2026-10-21T14343" />
  <link rel="stylesheet" href="/shared/css/base.css?v=v2026-10-21T14343" />
  <link rel="stylesheet" href="/manual/css/manual.css?v=v2026-10-21T14343" />
  <script>document.documentElement.classList.add('page-loading')</script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script type="module" src="/manual/js/manual.js?v=v2026-10-21T14343" defer></script>
  <script type="module" src="/shared/js/core/topbar-controller.js?v=v2026-10-21T14343" defer></script>
  <script src="/shared/js/core/security-warning.js?v=v2026-10-21T14343" defer></script>

</head>

<body class="manual-body skel-body">
  <header class="topbar topbar-layout-4" id="mainTopbar">
    <div class="topbar-section topbar-section-1">
      <div class="brand">FAMILIADA</div>
      <button class="btn" id="btnBack" type="button" data-i18n-icon="arrow-left">Wstecz</button>
    </div>
    <div class="topbar-section topbar-section-2">
      <button class="btn" id="btnLegal" type="button" data-i18n="manual.legal" data-i18n-icon-after="shield">Polityka prywatności</button>
    </div>
    <div class="topbar-section topbar-section-3">
      <div class="topbar-close-slot" aria-hidden="true"></div>
    </div>
    <div class="topbar-section topbar-section-4">
      <span class="who" id="who"></span>
      <button class="btn" id="btnLogout" type="button" data-i18n="common.authEntry" data-i18n-icon="person">Zaloguj / Załóż konto</button>
    </div>
  </header>

  <main class="wrap m-wrap" data-skel-step>
    <h1 class="page-title" data-i18n="manual.pageTitle">Wskazówki dla użytkownika</h1>
    <div class="page-subtitle mobile-only-tab-subtitle" id="manualTabSubtitle" aria-live="polite"></div>

    <nav class="simple-tabs" role="tablist" aria-label="Zakładki" data-i18n-aria-label="manual.tabsLabel">
      <button class="tab active" type="button" data-tab="rules" data-i18n="manual.tabs.rules">Zasady gry</button>
      <button class="tab" type="button" data-tab="account" data-i18n="manual.tabs.account">Konto</button>
      <button class="tab" type="button" data-tab="games" data-i18n="manual.tabs.games">Gry</button>
      <button class="tab" type="button" data-tab="logo" data-i18n="manual.tabs.logo">Logo</button>
      <button class="tab" type="button" data-tab="bases" data-i18n="manual.tabs.bases">Bazy pytań</button>
      <button class="tab" type="button" data-tab="people" data-i18n="manual.tabs.people">Znajomi i subskrybenci</button>
      <button class="tab" type="button" data-tab="community" data-i18n="manual.tabs.community">Gry społeczności</button>
      <button class="tab" type="button" data-tab="polls" data-i18n="manual.tabs.polls">Ankiety</button>
      <button class="tab" type="button" data-tab="settings" data-i18n="manual.tabs.settings">Ustawienia gry</button>
      <button class="tab" type="button" data-tab="control" data-i18n="manual.tabs.control">Prowadzenie gry</button>
      <button class="tab" type="button" data-tab="help" data-i18n="manual.tabs.help">Pomoc</button>
    </nav>

    <section class="tab-page tab-panel active" id="tab-rules" data-tab="rules"><div class="m-doc"></div></section>
    <section class="tab-page tab-panel" id="tab-account" data-tab="account"><div class="m-doc"></div></section>
    <section class="tab-page tab-panel" id="tab-games" data-tab="games"><div class="m-doc"></div></section>
    <section class="tab-page tab-panel" id="tab-logo" data-tab="logo"><div class="m-doc"></div></section>
    <section class="tab-page tab-panel" id="tab-bases" data-tab="bases"><div class="m-doc"></div></section>
    <section class="tab-page tab-panel" id="tab-people" data-tab="people"><div class="m-doc"></div></section>
    <section class="tab-page tab-panel" id="tab-community" data-tab="community"><div class="m-doc"></div></section>
    <section class="tab-page tab-panel" id="tab-polls" data-tab="polls"><div class="m-doc"></div></section>
    <section class="tab-page tab-panel" id="tab-settings" data-tab="settings"><div class="m-doc"></div></section>
    <section class="tab-page tab-panel" id="tab-control" data-tab="control"><div class="m-doc"></div></section>
    <section class="tab-page tab-panel" id="tab-help" data-tab="help"><div class="m-doc"></div></section>

    <div class="footer">
      <div data-i18n="common.footer.left">© 2026 Familiada — system do gry na żywo</div>
      <button class="btn-contact-footer" type="button" data-contact-modal data-i18n="common.contactBtn">Kontakt</button>
    </div>
  </main>
  <script type="module" src="/shared/js/core/contact-modal.js?v=v2026-10-21T14343"></script>

</body>
</html>
