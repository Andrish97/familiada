<!DOCTYPE html>
<html lang="pl">
<head>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta name="app-version" content="v2026-10-07T21060"/>

  <meta charset="UTF-8"/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://supabase.familiada.online">
  <title data-i18n="logoEditor.titles.draw">Familiada — edytor logo</title>

  <link rel="icon" href="/favicon.ico?v=v2026-10-07T21060"/>
  <link rel="manifest" href="/manifest.json?v=v2026-10-07T21060"/>
  <meta name="theme-color" content="#050914"/>
  <link rel="stylesheet" href="/shared/css/base.css?v=v2026-10-07T21060"/>
  <link rel="stylesheet" href="/games/css/games.css?v=v2026-10-07T21060"/>
  <link rel="stylesheet" href="/logo/css/logo.css?v=v2026-10-07T21060"/>
  <script>
    document.documentElement.classList.add('page-loading');
    try {
      var _has = false;
      for (var _i = 0; _i < localStorage.length; _i++) {
        var _k = localStorage.key(_i);
        if (_k && _k.startsWith('sb-') && _k.endsWith('-auth-token')) { _has = true; break; }
      }
      if (!_has) location.replace('/login/');
    } catch(_e) {}
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>

  <!-- Fix Fabric.js 5.x bug: uses 'alphabetical' instead of 'alphabetic' -->
  <script>
  (function(){
    var d = Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype, 'textBaseline');
    if (d && d.set) Object.defineProperty(CanvasRenderingContext2D.prototype, 'textBaseline', {
      get: d.get,
      set: function(v) { d.set.call(this, v === 'alphabetical' ? 'alphabetic' : v); },
      configurable: true
    });
  })();
  </script>
  <!-- Fabric.js (global: window.fabric) -->
  <script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

  <script type="module" src="/logo/js/editor-draw.js?v=v2026-10-07T21060" defer></script>
  <script src="/shared/js/core/security-warning.js?v=v2026-10-07T21060" defer></script>
</head>

<!-- Edytor logo (DRAW) — osobna strona /logo/editor-draw/?id=<logo>. Zmiany
     zapisują się same (bez przycisku „Zapisz” i bez pytań przy wyjściu),
     wspólna logika: /logo/js/editor-page.js. -->
<body class="games-body logo-body is-editor skel-body">
  <header class="topbar topbar-layout-4">
    <div class="topbar-section topbar-section-1">
      <button class="btn" id="btnBack" type="button" data-i18n="logoEditor.topbar.backToLogos" data-i18n-icon="arrow-left">Moje logo</button>
      <div class="brand" id="brandTitle"></div>
    </div>
    <div class="topbar-section topbar-section-2"></div>
    <div class="topbar-section topbar-section-3">
      <button class="btn" id="btnManual" type="button" data-i18n-aria-label="common.manualLabel" data-i18n-title="common.manualLabel" aria-label="Wskazówki" title="Wskazówki"><i class="ico" data-icon="info"></i></button>
    </div>
    <div class="topbar-section topbar-section-4">
      <span class="who" id="who"></span>
      <button class="btn" id="btnLogout" type="button" data-i18n="common.authEntry">Wyloguj</button>
    </div>
  </header>

  <main class="wrap logoWrap">
    <section class="editorShell" id="editorShell" data-mode="DRAW">
      <!-- cienki pasek: nazwa + stan zapisu -->
      <div class="editorLine">
        <div class="editorLineLeft">
          <span class="etlLbl" data-i18n="logoEditor.editor.nameLabel">Nazwa</span>
          <input class="inp etlName" id="logoName" placeholder="Np. Moje logo" maxlength="80" data-i18n-placeholder="logoEditor.editor.namePlaceholder" disabled/>
        </div>
        <div class="editorLineRight">
          <span class="saveStatus" id="saveStatus" data-state="idle" role="status" aria-live="polite"></span>
        </div>
      </div>

      <div class="card games-card editorCard">
        <div class="editorToolbar" id="editorToolbar">
          <!-- TOOLBAR dla DRAW -->
          <div class="toolRow" id="toolsDraw">

            <!-- Rząd 1: narzędzia -->
            <div class="toolGrid">
              <button class="tbtn" id="tSelect"   type="button" data-tip-pos="top" data-tip=""></button>
              <button class="tbtn" id="tPan"      type="button" data-tip-pos="top" data-tip=""></button>
              <button class="tbtn" id="tZoomIn"   type="button" data-tip-pos="top" data-tip=""></button>
              <button class="tbtn" id="tZoomOut"  type="button" data-tip-pos="top" data-tip=""></button>
              <button class="tbtn" id="tBg"       type="button" data-tip-pos="top" data-tip=""></button>
            </div>

            <div class="toolSep"></div>

            <div class="toolGrid">
              <button class="tbtn" id="tBrush"    type="button" data-tip-pos="top" data-tip=""></button>
              <button class="tbtn" id="tEraser"   type="button" data-tip-pos="top" data-tip=""></button>
              <button class="tbtn" id="tShapes"   type="button" data-tip-pos="top" data-tip=""></button>
              <button class="tbtn" id="tText"     type="button" data-tip-pos="top" data-tip=""></button>
            </div>

            <div class="toolSep"></div>

            <div class="toolGrid">
              <button class="tbtn" id="tUndo"     type="button" data-tip-pos="top" data-tip=""></button>
              <button class="tbtn" id="tRedo"     type="button" data-tip-pos="top" data-tip=""></button>
              <button class="tbtn" id="tDuplicate" type="button" data-tip-pos="top" data-tip=""></button>
              <button class="tbtn danger" id="tClear" type="button" data-tip-pos="top" data-tip=""></button>
              <button class="tbtn" id="tEye"      type="button" data-tip-pos="top" data-tip=""></button>
            </div>

            <!-- Separator poziomy między toolbarem a ustawieniami -->
            <div class="toolRowSep"></div>

            <!-- Rząd 2: kontekstowe ustawienia -->
            <div class="toolCtx" id="toolCtxSettings"></div>

          </div>
        </div><!-- /editorToolbar -->

        <div class="editorContent">
          <!-- DRAW: scena + kontekstowe ustawienia -->
          <div class="pane" id="paneDraw">
            <!-- Kontekstowe ustawienia narzędzia/obiektu -->
            <div class="drawSettings" id="drawSettings"></div>
            <!-- Canvas -->
            <div class="drawStageWrap">
              <div class="drawStageRatio" id="drawStageHost">
                <canvas id="drawStage" width="1" height="1"></canvas>
              </div>
            </div>
            <!-- Font picker popover (shared by text tool settings) -->
            <div id="drawFontPickPop" class="fontPickPop" hidden style="position:fixed;z-index:99999;display:block;">
              <div class="fontPickPanel ctxPop" style="width:min(520px,calc(100vw - 16px));max-height:min(360px,calc(100vh - 24px));overflow:hidden;padding:0;">
                <div class="fontPickSearch" style="display:flex;gap:6px;padding:10px;border-bottom:1px solid rgba(255,255,255,.10);">
                  <input id="drawFontSearchInp" class="inp" type="text" placeholder="Szukaj fontu…" data-i18n-placeholder="logoEditor.draw.ui.fontSearchPlaceholder" style="flex:1;height:30px;font-size:13px;">
                  <button id="drawFontSearchClear" class="btn sm" type="button" style="min-width:30px;padding:0 8px;" aria-label="Wyczyść" data-i18n-aria-label="baseExplorer.search.clear"><i class="ico" data-icon="close"></i></button>
                </div>
                <div id="drawFontList" style="overflow-y:auto;max-height:280px;padding:6px;"></div>
                <div id="drawFontEmpty" class="fontPickEmpty" hidden style="padding:16px;text-align:center;opacity:.6;font-size:13px;" data-i18n="logoEditor.draw.ui.fontNoResults">Brak wyników</div>
              </div>
            </div>
          </div>
        </div><!-- /editorContent -->
      </div><!-- /editorCard -->
    </section>

    <!-- Fullscreen preview (MODAL z X) -->
    <div class="overlay modal--sheet" id="previewOverlay" style="display:none;">
      <div class="modal previewModal">
        <div class="previewModalTitle">
          <div>
            <div class="mTitle" data-i18n="logoEditor.preview.title">Podgląd</div>
            <div class="mSub" data-i18n="logoEditor.preview.subtitle">Tak będzie wyglądać logo na wyświetlaczu</div>
          </div>
          <button class="btn sm" id="btnPreviewClose" type="button" aria-label="Zamknij" data-i18n-aria-label="common.modal.closeLabel"><i class="ico" data-icon="close"></i></button>
        </div>
        <div class="previewModalCanvas">
          <canvas id="bigPreviewFull" width="1600" height="700"></canvas>
        </div>
      </div>
    </div>

    <div class="footer">
      <div data-i18n="common.footer.left">© 2026 Familiada — system do gry na żywo</div>
      <button class="btn-contact-footer" type="button" data-contact-modal data-i18n="common.contactBtn">Kontakt</button>
    </div>
  </main>

  <script type="module" src="/shared/js/core/contact-modal.js?v=v2026-10-07T21060"></script>
  <script type="module" src="/shared/js/core/topbar-controller.js?v=v2026-10-07T21060"></script>
</body>
</html>
