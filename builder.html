<!DOCTYPE html>
<html lang="pl">
<head>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta charset="UTF-8"/>
  <!-- Stary adres strony „Moje gry”. Strona nazywa się teraz /games —
       ten plik tylko przekierowuje (zachowuje ?parametry i #hash),
       żeby stare zakładki, skróty PWA i linki dalej działały. -->
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Familiada — moje gry</title>
  <link rel="canonical" href="https://www.familiada.online/games"/>
  <script>
    location.replace('/games' + location.search + location.hash);
  </script>
  <meta http-equiv="refresh" content="0; url=/games"/>
</head>
<body>
  <p><a href="/games">Familiada — moje gry</a></p>
</body>
</html>
