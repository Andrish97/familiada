# Fragment do konfiguracji prywatnego serwera. Bez publicznego portu i domeny.
services:
  market-semantic:
    image: familiada-market-semantic:DEPLOY_SHA
    restart: unless-stopped
    env_file: /etc/familiada/market-semantic.env
    environment:
      MODEL_THREADS: '1'
    networks: [supabase]
    mem_limit: 1024m
    cpus: 1
    read_only: true
    tmpfs: [/tmp:size=32m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: 5m, max-file: '2' }
networks:
  supabase:
    external: true
    name: supabase_default
