name: TMP sql-gate (próba na branchu, do usunięcia)
permissions:
  contents: read
on:
  push:
    branches: ["claude/comprehensive-page-action-tests-uyi8qz"]
jobs:
  sql-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -qc "alter user postgres password 'postgres'"
      - env:
          PGPASSWORD: postgres
          PSQL_ADMIN: psql -h localhost -U postgres
        run: scripts/sql-gate.sh $(git diff --name-only --diff-filter=A origin/main HEAD -- 'supabase/migrations/*.sql' | sort)
