name: Cloudflare token — identyfikacja (tylko odczyt)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Sprawdź token zapisany w GitHubie (bez wartości sekretu)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token) { console.log('CLOUDFLARE_API_TOKEN: brak'); process.exit(1); }
          const options = { headers: { Authorization: `Bearer ${token}` }, redirect: 'error' };
          const res = await fetch('https://api.cloudflare.com/client/v4/user/tokens/verify', options);
          if (!res.ok) { console.log(`Weryfikacja tokenu: HTTP ${res.status}`); process.exit(1); }
          const data = await res.json();
          const id = data.result?.id;
          if (!data.success || !/^[0-9a-f]{32}$/i.test(id || '')) {
            console.log('Weryfikacja tokenu: nieprawidłowa odpowiedź'); process.exit(1);
          }
          console.log(`Token w repo familiada: status=${data.result.status}, końcówka ID=${id.slice(-8)}`);
          const details = await fetch(`https://api.cloudflare.com/client/v4/user/tokens/${id}`, options);
          if (details.ok) {
            const meta = await details.json();
            if (meta.success && meta.result?.id === id && typeof meta.result.name === 'string') {
              console.log(`Nazwa tokenu: ${JSON.stringify(meta.result.name)}`);
            }
          } else {
            console.log(`Nazwa tokenu niedostępna dla tego uprawnienia (HTTP ${details.status})`);
          }
          const list = await fetch('https://api.cloudflare.com/client/v4/user/tokens?per_page=50', options);
          const listing = await list.json().catch(() => ({}));
          if (list.ok && listing.success) {
            const current = listing.result?.find(item => item.id === id);
            console.log(current ? `Nazwa z listy tokenów: ${JSON.stringify(current.name)}` : 'Bieżącego tokenu nie znaleziono na pierwszej stronie listy');
          } else {
            const codes = (listing.errors || []).map(item => item.code).filter(item => typeof item === 'number');
            console.log(`Lista tokenów: HTTP ${list.status}, kody błędów=${JSON.stringify(codes)}`);
          }
          if (list.ok && listing.success) {
            const accountsRes = await fetch('https://api.cloudflare.com/client/v4/accounts?per_page=50', options);
            const accountsData = await accountsRes.json().catch(() => ({}));
            if (!accountsRes.ok || !accountsData.success) {
              console.log(`Konta do sprawdzenia historii: HTTP ${accountsRes.status}`);
            } else {
              const since = new Date(Date.now() - 30 * 86400000).toISOString().slice(0, 10);
              const before = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
              const names = new Set(['familiada-worker-deploy', 'Edit Cloudflare Workers']);
              for (const item of listing.result.filter(item => names.has(item.name))) {
                console.log(`Sprawdzany token: ${JSON.stringify(item.name)}, status=${item.status}, końcówka ID=${item.id.slice(-8)}`);
                for (const account of accountsData.result || []) {
                  const query = new URLSearchParams({ actor_token_id: item.id, since, before, limit: '1', direction: 'desc' });
                  const audit = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account.id}/logs/audit?${query}`, options);
                  const result = await audit.json().catch(() => ({}));
                  if (!audit.ok || !result.success) {
                    console.log(`Historia ${JSON.stringify(item.name)}: HTTP ${audit.status}`);
                    continue;
                  }
                  const event = result.result?.[0];
                  if (!event) {
                    console.log(`Historia ${JSON.stringify(item.name)}: brak zdarzeń w zakresie ${since}–${before}`);
                  } else if (event.actor?.token_id === item.id) {
                    console.log(`Historia ${JSON.stringify(item.name)}: ostatnie zdarzenie=${event.action?.time}, produkt=${JSON.stringify(event.resource?.product)}, operacja=${JSON.stringify(event.action?.type)}`);
                  } else {
                    console.log(`Historia ${JSON.stringify(item.name)}: odpowiedź nie potwierdza filtra tokenu`);
                  }
                }
              }
            }
          }
          JS
