name: Secrets discovery (jednorazowy, tylko odczyt)

# Jednorazowe rozpoznanie przed rotacją sekretów (audyt bezpieczeństwa,
# „Wymagane przed wdrożeniem”). Repo publiczne: wypisuje WYŁĄCZNIE ścieżki,
# NAZWY zmiennych i wartości logiczne. Nigdy wartości. Do usunięcia po rotacji.

permissions:
  contents: read

on:
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Discover (server-side, names only)
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" 'bash -s' > /tmp/out.txt 2>&1 <<'EOS' || true
          set +x
          names() { grep -oE '^[[:space:]]*(export[[:space:]]+)?[A-Za-z_][A-Za-z0-9_]*=' "$1" 2>/dev/null | sed -E 's/^[[:space:]]*(export[[:space:]]+)?//' | sort | tr '\n' ' '; echo; }
          r1() { sed -E 's/([A-Za-z_][A-Za-z0-9_]*)=("[^"]*"|'"'"'[^'"'"']*'"'"'|[^[:space:]]*)/\1=<v>/g; s/:-[^}]*\}/:-<v>}/g' | sed -E '/^[[:space:]-]*(container_name|image|env_file|restart|context|dockerfile|depends_on|condition|volumes|environment|entrypoint|command|healthcheck|services|build|ports|networks)[[:space:]]*:/b; s/^([[:space:]-]*[A-Za-z_][A-Za-z0-9_.-]*:[[:space:]]*)[^$[:space:]].*$/\1<v>/'; }
          redact() { while IFS= read -r L; do printf '%s:%s\n' "${L%%:*}" "$(printf '%s\n' "${L#*:}" | r1)"; done; }
          echo "== containers"
          docker ps --format '{{.Names}} | {{.Image}} | {{.Status}}'
          for C in $(docker ps --format '{{.Names}}' | grep -Ei 'edge|function|lead'); do
            echo "== container $C"
            echo "compose workdir: $(docker inspect -f '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' $C)"
            echo "compose files: $(docker inspect -f '{{index .Config.Labels "com.docker.compose.project.config_files"}}' $C)"
            echo "compose service: $(docker inspect -f '{{index .Config.Labels "com.docker.compose.service"}}' $C)"
            echo "env names: $(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' $C | cut -d= -f1 | sort | tr '\n' ' ')"
            echo "mounts: $(docker inspect -f '{{range .Mounts}}{{.Source}}->{{.Destination}} {{end}}' $C)"
            for K in MAIL_WORKER_SECRET GENERATE_GAME_SECRET LEAD_FINDER_API_KEY; do
              V=$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' $C | grep "^$K=" | cut -d= -f2-)
              [ -n "$V" ] && echo "$K nonempty in $C: true" || echo "$K nonempty in $C: false"
            done
          done
          echo "== deploy scripts (redacted lines)"
          for F in ~/supabase-selfhost/supabase/scripts/deploy-edge.sh ~/supabase-selfhost/supabase/scripts/deploy-lead-finder.sh; do
            echo "-- $F ($(stat -c '%a %U' $F 2>/dev/null))"
            grep -nEi 'env|compose|docker|restart|cp |rsync|mv |health|curl|cd ' "$F" 2>/dev/null | grep -vEi 'key|secret|token|pass' | redact
          done
          echo "== compose: functions service block (redacted)"
          for F in ~/supabase-selfhost/supabase/docker/docker-compose.yml ~/supabase-selfhost/supabase/docker/docker-compose.override.yml; do
            echo "-- $F"
            awk '/^  functions:/{f=1} f&&/^  [a-z]/&&!/^  functions:/{f=0} f{print NR": "$0}' "$F" | grep -vEi 'key|secret|token|pass' | redact
            grep -nE 'GENERATE_GAME_SECRET|MAIL_WORKER_SECRET|LEAD_FINDER_API_KEY' "$F" | redact
          done
          echo "== env files (names only)"
          F=~/supabase-selfhost/supabase/docker/.env
          echo "-- $F ($(stat -c '%a %U' $F))"
          for K in GENERATE_GAME_SECRET MAIL_WORKER_SECRET LEAD_FINDER_API_KEY; do echo "$K lines in .env: $(grep -c "^$K=" $F)"; done
          for F in $(find ~ -maxdepth 5 -path '*lead*' \( -name '.env' -o -name '*.env' \) -type f 2>/dev/null); do echo "-- $F ($(stat -c '%a %U' $F)): $(names $F)"; done
          echo "== vault"
          docker exec supabase-db psql -U supabase_admin -d postgres -tA -c "select name from vault.secrets where name in ('mail_worker_secret','generate_game_secret') order by 1"
          VH=$(docker exec supabase-db psql -U supabase_admin -d postgres -tA -c "select decrypted_secret from vault.decrypted_secrets where name='mail_worker_secret'" | tr -d '\n' | sha256sum | cut -d' ' -f1)
          for C in $(docker ps --format '{{.Names}}' | grep -Ei 'edge|function'); do
            EH=$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' $C | grep '^MAIL_WORKER_SECRET=' | cut -d= -f2- | tr -d '\n' | sha256sum | cut -d' ' -f1)
            [ "$EH" = "$VH" ] && echo "MAIL_WORKER_SECRET($C) == vault mail_worker_secret: true" || echo "MAIL_WORKER_SECRET($C) == vault mail_worker_secret: false"
          done
          EOS
          # bez listy kontenerów i nazw env lead-findera (już znane, długie)
          sed -n '/^== deploy scripts/,$p' /tmp/out.txt > /tmp/o2.txt
          split -l 25 /tmp/o2.txt /tmp/part.
          for P in /tmp/part.*; do
            MSG=$(sed -e 's/%/%25/g' "$P" | cut -c1-300 | awk '{printf "%s%%0A", $0}')
            echo "::notice title=Discovery $(basename $P)::$MSG"
          done
