name: E2E Tests (Playwright)

on:
  workflow_dispatch:
    inputs:
      spec_filter:
        description: 'Opcjonalnie: odpal tylko wybrany plik/wzorzec (np. "e2e/nowy-test.spec.js" albo "--grep nazwa"). Puste = wszystkie testy.'
        required: false
        default: ""

# WAŻNE: celowo tylko workflow_dispatch — ani push, ani pull_request.
# Ten workflow loguje się na prawdziwe konta na produkcji (TEST_USERNAME,
# świeże konta gości) i ma dostęp do E2E_BYPASS_SECRET/TEST_PASSWORD;
# każda zmiana w tests/** (nawet dokumentacja) nie powinna sama z siebie
# odpalać logowań na produkcję. Odpalaj świadomie: Actions → "E2E Tests
# (Playwright)" → Run workflow.

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci
        working-directory: tests

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: tests

      # Cloudflare Bot Fight Mode jest na stałe wyłączony w dashboardzie
      # (Security → Bots) — na Free planie nie da się go pominąć per-request
      # (nie działa na silniku reguł, WAF Custom Rules/Configuration Rules go
      # nie dotyczą), więc jedyną opcją było albo płacić, albo wyłączyć na
      # stałe. Turnstile na /login (osobny mechanizm, patrz e2e-token.js)
      # zostaje jako właściwa ochrona przed botami przy logowaniu.
      - name: Run E2E tests
        env:
          E2E_BYPASS_SECRET: ${{ secrets.E2E_BYPASS_SECRET }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        # spec_filter jest tylko w workflow_dispatch — na zwykłym pushu
        # jest puste, więc leci cały zestaw testów jak dotychczas.
        run: npm test -- ${{ github.event.inputs.spec_filter }}
        working-directory: tests

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-screenshots
          path: tests/test-results/
          retention-days: 7
