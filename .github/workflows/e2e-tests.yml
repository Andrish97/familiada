name: E2E Tests (Playwright)

on:
  workflow_dispatch:
    inputs:
      spec_filter:
        description: 'Opcjonalnie: odpal tylko wybrany plik/wzorzec (np. "e2e/nowy-test.spec.js" albo "--grep nazwa"). Puste = wszystkie testy, w równoległych grupach (patrz niżej). To pole jest najczęściej używane -- pojedynczy plik/wzorzec zamiast całego zestawu.'
        required: false
        default: ""

# WAŻNE: celowo tylko workflow_dispatch — ani push, ani pull_request.
# Ten workflow loguje się na prawdziwe konta na produkcji (TEST_USERNAME,
# świeże konta gości) i ma dostęp do E2E_BYPASS_SECRET/TEST_PASSWORD;
# odpalany wyłącznie ręcznie, świadomie, kiedy faktycznie trzeba:
# Actions → "E2E Tests (Playwright)" → Run workflow. Pole "spec_filter"
# pozwala odpalić wyrywkowo tylko jeden plik/wzorzec zamiast całego
# zestawu (wtedy leci jeden job, e2e-custom-filter, bez podziału na grupy
# niżej) -- to zdecydowanie najczęstszy sposób odpalania. Jeden silnik
# testów przez cały czas: jeden playwright.config.js, jedna komenda
# `playwright test` (przez `npm test`) w obu jobach -- różni się tylko to,
# CO dokładnie się odpala i z jakim `--workers`, nie JAK.
#
# Dlaczego kilka grup zamiast jednego joba na workers:1 (historia):
# Cały zestaw leciał SZEREGOWO (workers:1 w playwright.config.js) bo
# game-deletion/restore-demo/cross-resource-locks/... dzielą jedno konto
# TEST_USERNAME i dwa jednoczesne logowania na to samo konto dawały
# niedeterministyczne błędy (zawieszony modal / timeout logowania) —
# workers:1 w Playwright zostaje z tego właśnie powodu wewnątrz KAŻDEJ
# grupy poniżej, chyba że dana grupa ma własną pulę kont (patrz "control2"
# niżej). account-deletion/guest-migration (loginAsGuest — świeże konto za
# każdym razem) i static-assets-routing (brak logowania w ogóle) nie
# dotykają żadnego współdzielonego konta.
#
# PULA KONT "testX" (test1@…...test10@…, do 10, wspólne TEST_PASSWORD,
# wyliczane z domeny TEST_USERNAME przez e2e/helpers/login.js's
# testAccountUsername(n) -- CELOWO bez żadnego sekretu z listą loginów,
# sam wzorzec loginu bez prawdziwego hasła niczego nie odsłania) jest
# rozdzielona NA STAŁE, żeby dwie grupy uruchomione równolegle nigdy nie
# dzieliły konta:
#   - test1, test2 — base-explorer.spec.js/bases.spec.js (pierwsze i
#     drugie zalogowane konto w tych plikach, do testów interakcji dwóch
#     użytkowników naraz -- to właśnie odróżnia grupę "konto-drugie" od
#     "konto-glowne", nie żaden osobny sekret).
#   - test3..test10 (do 8 kont) — control2.spec.js, pula do prawdziwej
#     równoległości WEWNĄTRZ pliku (Playwright --workers=N, każdy worker
#     na innym koncie po testInfo.parallelIndex, patrz
#     loginAsControl2TestUser) -- to jedyny plik na tyle ciężki (pełne
#     rozgrywki 4 urządzeń, naturalne wygaśnięcie timerów finału), że
#     warto. Rozmiar sterowany jedną, jawną (NIE sekretną)
#     CONTROL2_TEST_ACCOUNT_COUNT poniżej -- więcej równoległości = zmiana
#     tej jednej cyfry. Konta test1@…...testN@… trzeba realnie założyć na
#     produkcji, tyle ile faktycznie wykorzystywane.
#
# Wszystkie grupy pełnego zestawu to jeden job (macierz,
# "strategy.matrix") w jednym pliku -- nie osobne joby -- więc
# instalacja/cache/upload artefaktów są zdefiniowane raz. Podział na
# równoległe uruchomienia macierzy przez GitHub Actions (nie tylko
# workers Playwrighta) skraca REALNY czas oczekiwania z sumy wszystkich
# testów do czasu najdłuższej grupy.
env:
  # Liczba kont test3@…/test4@…/... dla control2.spec.js (test1/test2 są
  # zarezerwowane dla base-explorer/bases, patrz wyżej) -- podnieś tę jedną
  # liczbę, jeśli założysz więcej kont na produkcji (max 8, żeby zmieścić
  # się w budżecie 10 kont razem z test1/test2).
  CONTROL2_TEST_ACCOUNT_COUNT: "4"

jobs:
  e2e-grouped:
    if: ${{ github.event.inputs.spec_filter == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: konto-glowne
            files: >-
              e2e/game-deletion.spec.js e2e/restore-demo.spec.js
              e2e/cross-resource-locks.spec.js
              e2e/editor.spec.js e2e/game-settings.spec.js
              e2e/game-state-realtime-spike.spec.js e2e/polls.spec.js
          - name: konto-drugie
            files: e2e/base-explorer.spec.js e2e/bases.spec.js
          - name: goscie-i-statyka
            files: >-
              e2e/account-deletion.spec.js e2e/guest-migration.spec.js
              e2e/static-assets-routing.spec.js
          - name: control2
            files: e2e/control2.spec.js

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: tests

      # Cache samych binarek przeglądarki (~/.cache/ms-playwright) osobno od
      # npm cache powyżej — klucz po wersji @playwright/test z package-lock,
      # więc bump wersji automatycznie unieważnia cache i ściąga nową. Playwright
      # CLI samo wykrywa już obecne binarki i pomija ich pobieranie (nawet bez
      # tego kroku by nie pobrał drugi raz w tym samym jobie) — cache pozwala to
      # wykryć MIĘDZY uruchomieniami, bo każdy run zaczyna na świeżej maszynie.
      # System deps (apt, --with-deps) i tak instalują się na nowo za każdym
      # razem — ta VM resetuje się między runami, nic tu nie da się scache'ować.
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./node_modules/@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
        working-directory: tests

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: tests

      # Cloudflare Bot Fight Mode jest na stałe wyłączony w dashboardzie
      # (Security → Bots) — na Free planie nie da się go pominąć per-request
      # (nie działa na silniku reguł, WAF Custom Rules/Configuration Rules go
      # nie dotyczą), więc jedyną opcją było albo płacić, albo wyłączyć na
      # stałe. Turnstile na /login (osobny mechanizm, patrz e2e-token.js)
      # zostaje jako właściwa ochrona przed botami przy logowaniu.
      #
      # Grupa "control2" dostaje osobną gałąź: liczba workerów =
      # CONTROL2_TEST_ACCOUNT_COUNT (jawna liczba, patrz komentarz na
      # górze pliku) — każdy worker loguje się na konto test<N>@… (patrz
      # loginAsControl2TestUser), więc żaden nie czeka w kolejce za innym.
      # Reszta grup zostaje na domyślnym `npm test` (workers:1 z
      # playwright.config.js — współdzielone konto w danej grupie nadal
      # wymaga szeregowości; "konto-drugie" jest bezpieczna obok
      # "konto-glowne" właśnie dlatego, że loguje się na test1/test2, nie
      # na zwykłe TEST_USERNAME).
      - name: Run E2E tests (${{ matrix.group.name }})
        env:
          E2E_BYPASS_SECRET: ${{ secrets.E2E_BYPASS_SECRET }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          if [ "${{ matrix.group.name }}" = "control2" ]; then
            echo "Pula kont control2: $CONTROL2_TEST_ACCOUNT_COUNT worker(ów)"
            npx playwright test ${{ matrix.group.files }} --workers="$CONTROL2_TEST_ACCOUNT_COUNT"
          else
            npm test -- ${{ matrix.group.files }}
          fi
        working-directory: tests

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-screenshots-${{ matrix.group.name }}
          path: tests/test-results/
          retention-days: 7

  e2e-custom-filter:
    if: ${{ github.event.inputs.spec_filter != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: tests

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./node_modules/@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
        working-directory: tests

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: tests

      # spec_filter jest najczęstszą drogą odpalania (patrz komentarz na
      # górze pliku) -- gdy filtr celuje w control2.spec.js, dostaje tę
      # samą pulę kont/workers co w e2e-grouped (dopasowanie po samej
      # nazwie pliku w filtrze, nie po osobnym polu) zamiast czekać na
      # zwykłe workers:1. Każdy inny filtr leci przez zwykłe `npm test`,
      # tak jak dziś.
      - name: Run E2E tests (spec_filter)
        env:
          E2E_BYPASS_SECRET: ${{ secrets.E2E_BYPASS_SECRET }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          FILTER="${{ github.event.inputs.spec_filter }}"
          if echo "$FILTER" | grep -q "control2"; then
            echo "Pula kont control2: $CONTROL2_TEST_ACCOUNT_COUNT worker(ów)"
            npx playwright test $FILTER --workers="$CONTROL2_TEST_ACCOUNT_COUNT"
          else
            npm test -- $FILTER
          fi
        working-directory: tests

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-screenshots
          path: tests/test-results/
          retention-days: 7
