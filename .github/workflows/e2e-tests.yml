name: E2E Tests (Playwright)

on:
  workflow_dispatch:
    inputs:
      spec_filter:
        description: 'Opcjonalnie: odpal tylko wybrany plik/wzorzec (np. "e2e/nowy-test.spec.js" albo "--grep nazwa"). Puste = wszystkie testy, w równoległych grupach (patrz niżej). To pole jest najczęściej używane -- pojedynczy plik/wzorzec zamiast całego zestawu.'
        required: false
        default: ""

# WAŻNE: celowo tylko workflow_dispatch — ani push, ani pull_request.
# Ten workflow loguje się na prawdziwe konta na produkcji i ma dostęp do
# E2E_BYPASS_SECRET/TEST_PASSWORD; odpalany wyłącznie ręcznie, świadomie,
# kiedy faktycznie trzeba: Actions → "E2E Tests (Playwright)" → Run
# workflow. Pole "spec_filter" pozwala odpalić wyrywkowo tylko jeden
# plik/wzorzec zamiast całego zestawu (wtedy leci jeden job,
# e2e-custom-filter, bez podziału na grupy niżej) -- to zdecydowanie
# najczęstszy sposób odpalania.
#
# TYLKO DWA SEKRETY W OGÓLE: E2E_BYPASS_SECRET (omija Turnstile) i
# TEST_PASSWORD (wspólne hasło wszystkich kont testowych). Loginy kont
# testowych to zawsze wzorzec test<N>@familiada.online -- domena jest
# stałą w kodzie (e2e/helpers/login.js), nie sekretem, bo produkcja to
# zawsze ta sama domena i sam login bez prawdziwego hasła niczego nie
# odsłania. Zero sekretu z listą loginów, zero osobnego konta "głównego".
#
# JEDEN SILNIK TESTÓW, JEDNA KOMENDA WSZĘDZIE: ten sam playwright.config.js,
# ta sama `playwright test ... --workers="$TEST_WORKERS"` w KAŻDEJ grupie
# e2e-grouped i w e2e-custom-filter -- bez żadnego "jeśli to ten plik, to
# inaczej". Pula kont test1@…...test10@… (TEST_ACCOUNT_COUNT kolejnych,
# licząc od test1 — patrz getTestAccountPool w e2e/helpers/login.js) jest
# dostępna w CAŁOŚCI każdemu filtrowi/grupie, bez sztywnego podziału
# między plikami — który dokładnie numer trafia do którego testu decyduje
# kod TEGO pliku (np. control2.spec.js woła loginAsPooledTestUser z
# testInfo.parallelIndex; base-explorer.spec.js/bases.spec.js jawnie
# wybierają testAccountUsername(1)/(2) na dwa jednocześnie zalogowane
# konta w tym samym teście).
#
# WAŻNE, znalezione na własnej skórze (run #122, 12/16 testów control2
# failed, 57 minut): TEST_ACCOUNT_COUNT (rozmiar puli kont) i TEST_WORKERS
# (realna liczba RÓWNOLEGŁYCH workerów Playwrighta) to CELOWO DWIE RÓŻNE
# liczby, nie jedna. Runner GitHub Actions (ubuntu-latest) ma ograniczoną
# liczbę rdzeni, a każdy POJEDYNCZY test control2.spec.js sam otwiera do 4
# kontekstów przeglądarki naraz (Control+Display+Host+Buzzer) -- przy
# --workers=10 to do 40 jednoczesnych instancji Chromium na jednej
# maszynie. Runner fizycznie nie nadążał renderować strony w czasie, na
# jaki czekał Playwright -- stąd masowe "element is not stable"/"element
# is not enabled" i timeouty, NIE błąd logiki testów. TEST_ACCOUNT_COUNT
# może bezpiecznie zostać wysoki (więcej kont w pogotowiu na przyszłość,
# np. mocniejszy runner) -- to TEST_WORKERS reguluje faktyczne obciążenie
# i musi zostać niski. Podnoś TEST_WORKERS ostrożnie, po jednym, sprawdzając
# realny wynik, nie zgadując.
#
# Reszta testów (game-deletion, editor, cross-resource-locks, ...) używa
# domyślnego loginAsTestUser bez jawnego username -> zawsze test1, więc
# idzie szeregowo w swojej grupie (workers:1 z playwright.config.js jest
# używane tylko lokalnie/poza CI — w CI workers zawsze nadpisuje ten
# jeden, wspólny --workers).
env:
  TEST_ACCOUNT_COUNT: "10"
  TEST_WORKERS: "2"

jobs:
  e2e-grouped:
    if: ${{ github.event.inputs.spec_filter == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: konto-glowne
            files: >-
              e2e/game-deletion.spec.js e2e/restore-demo.spec.js
              e2e/cross-resource-locks.spec.js
              e2e/editor.spec.js e2e/game-settings.spec.js
              e2e/game-state-realtime-spike.spec.js e2e/polls.spec.js
          - name: konto-drugie
            files: e2e/base-explorer.spec.js e2e/bases.spec.js
          - name: goscie-i-statyka
            files: >-
              e2e/account-deletion.spec.js e2e/guest-migration.spec.js
              e2e/static-assets-routing.spec.js
          - name: control2
            files: e2e/control2.spec.js

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: tests

      # Cache samych binarek przeglądarki (~/.cache/ms-playwright) osobno od
      # npm cache powyżej — klucz po wersji @playwright/test z package-lock,
      # więc bump wersji automatycznie unieważnia cache i ściąga nową. Playwright
      # CLI samo wykrywa już obecne binarki i pomija ich pobieranie (nawet bez
      # tego kroku by nie pobrał drugi raz w tym samym jobie) — cache pozwala to
      # wykryć MIĘDZY uruchomieniami, bo każdy run zaczyna na świeżej maszynie.
      # System deps (apt, --with-deps) i tak instalują się na nowo za każdym
      # razem — ta VM resetuje się między runami, nic tu nie da się scache'ować.
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./node_modules/@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
        working-directory: tests

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: tests

      # Cloudflare Bot Fight Mode jest na stałe wyłączony w dashboardzie
      # (Security → Bots) — na Free planie nie da się go pominąć per-request
      # (nie działa na silniku reguł, WAF Custom Rules/Configuration Rules go
      # nie dotyczą), więc jedyną opcją było albo płacić, albo wyłączyć na
      # stałe. Turnstile na /login (osobny mechanizm, patrz e2e-token.js)
      # zostaje jako właściwa ochrona przed botami przy logowaniu.
      - name: Run E2E tests (${{ matrix.group.name }})
        env:
          E2E_BYPASS_SECRET: ${{ secrets.E2E_BYPASS_SECRET }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npx playwright test ${{ matrix.group.files }} --workers="$TEST_WORKERS"
        working-directory: tests

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-screenshots-${{ matrix.group.name }}
          path: tests/test-results/
          retention-days: 7

  e2e-custom-filter:
    if: ${{ github.event.inputs.spec_filter != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: tests

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./node_modules/@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
        working-directory: tests

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: tests

      - name: Run E2E tests (spec_filter)
        env:
          E2E_BYPASS_SECRET: ${{ secrets.E2E_BYPASS_SECRET }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npx playwright test ${{ github.event.inputs.spec_filter }} --workers="$TEST_WORKERS"
        working-directory: tests

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-screenshots
          path: tests/test-results/
          retention-days: 7
