name: E2E Tests (Playwright)

on:
  workflow_dispatch:
    inputs:
      spec_filter:
        description: 'Opcjonalnie: odpal tylko wybrany plik/wzorzec (np. "e2e/nowy-test.spec.js" albo "--grep nazwa"). Puste = wszystkie testy, w 4 równoległych jobach (patrz niżej).'
        required: false
        default: ""

# WAŻNE: celowo tylko workflow_dispatch — ani push, ani pull_request.
# Ten workflow loguje się na prawdziwe konta na produkcji (TEST_USERNAME,
# świeże konta gości) i ma dostęp do E2E_BYPASS_SECRET/TEST_PASSWORD;
# odpalany wyłącznie ręcznie, świadomie, kiedy faktycznie trzeba:
# Actions → "E2E Tests (Playwright)" → Run workflow. Pole "spec_filter"
# pozwala odpalić wyrywkowo tylko jeden plik/wzorzec zamiast całego
# zestawu (wtedy leci jeden job, bez podziału na grupy niżej).
#
# Dlaczego kilka grup zamiast jednego joba na workers:1 (historia):
# Cały zestaw leciał SZEREGOWO (workers:1 w playwright.config.js) bo
# game-deletion/restore-demo/cross-resource-locks/... dzielą jedno konto
# TEST_USERNAME i dwa jednoczesne logowania na to samo konto dawały
# niedeterministyczne błędy (zawieszony modal / timeout logowania) —
# workers:1 w Playwright zostaje z tego właśnie powodu wewnątrz KAŻDEJ
# grupy poniżej. ALE base-explorer.spec.js (69 testów, zdecydowanie
# największy pojedynczy plik) i bases.spec.js logują się na ZUPEŁNIE INNE
# konto (TEST_USERNAME_2) — nie mają więc żadnego powodu czekać w kolejce
# za testami na TEST_USERNAME. Podobnie account-deletion/guest-migration
# (loginAsGuest — świeże konto za każdym razem) i static-assets-routing
# (brak logowania w ogóle) nie dotykają żadnego współdzielonego konta.
#
# control2.spec.js dostaje WŁASNY job z WŁASNĄ pulą kont (sekret
# CONTROL2_TEST_ACCOUNTS, lista loginów po przecinku, wspólne TEST_PASSWORD)
# -- to jedyny plik na tyle ciężki (pełne rozgrywki 4 urządzeń, naturalne
# wygaśnięcie timerów finału), że warto dać mu prawdziwą równoległość
# WEWNĄTRZ pliku (Playwright --workers=<rozmiar puli>, każdy worker
# przypisany do innego konta po testInfo.parallelIndex, patrz
# e2e/helpers/login.js's loginAsControl2TestUser) zamiast tylko szeregowej
# kolejki. Rozmiar puli (a więc liczba workerów) liczony jest w locie z
# treści sekretu -- dodanie/usunięcie konta to tylko edycja tego jednego
# sekretu, bez zmian w tym workflow. Pusty/brak sekretu -> pada z powrotem
# na samo TEST_USERNAME, workers=1 (dzisiejsze zachowanie).
#
# Podział na równoległe joby GitHub Actions (nie tylko workers Playwrighta)
# skraca REALNY czas oczekiwania z sumy wszystkich testów do czasu
# najdłuższej grupy. Instalacja (checkout/npm ci/Playwright browsers,
# ~30-60s) dzieje się teraz kilka razy równolegle zamiast raz, ale to i tak
# pomijalne wobec czasu samych testów.
jobs:
  e2e-grouped:
    if: ${{ github.event.inputs.spec_filter == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: konto-glowne
            files: >-
              e2e/game-deletion.spec.js e2e/restore-demo.spec.js
              e2e/cross-resource-locks.spec.js
              e2e/editor.spec.js e2e/game-settings.spec.js
              e2e/game-state-realtime-spike.spec.js e2e/polls.spec.js
          - name: konto-drugie
            files: e2e/base-explorer.spec.js e2e/bases.spec.js
          - name: goscie-i-statyka
            files: >-
              e2e/account-deletion.spec.js e2e/guest-migration.spec.js
              e2e/static-assets-routing.spec.js

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: tests

      # Cache samych binarek przeglądarki (~/.cache/ms-playwright) osobno od
      # npm cache powyżej — klucz po wersji @playwright/test z package-lock,
      # więc bump wersji automatycznie unieważnia cache i ściąga nową. Playwright
      # CLI samo wykrywa już obecne binarki i pomija ich pobieranie (nawet bez
      # tego kroku by nie pobrał drugi raz w tym samym jobie) — cache pozwala to
      # wykryć MIĘDZY uruchomieniami, bo każdy run zaczyna na świeżej maszynie.
      # System deps (apt, --with-deps) i tak instalują się na nowo za każdym
      # razem — ta VM resetuje się między runami, nic tu nie da się scache'ować.
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./node_modules/@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
        working-directory: tests

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: tests

      # Cloudflare Bot Fight Mode jest na stałe wyłączony w dashboardzie
      # (Security → Bots) — na Free planie nie da się go pominąć per-request
      # (nie działa na silniku reguł, WAF Custom Rules/Configuration Rules go
      # nie dotyczą), więc jedyną opcją było albo płacić, albo wyłączyć na
      # stałe. Turnstile na /login (osobny mechanizm, patrz e2e-token.js)
      # zostaje jako właściwa ochrona przed botami przy logowaniu.
      - name: Run E2E tests (${{ matrix.group.name }})
        env:
          E2E_BYPASS_SECRET: ${{ secrets.E2E_BYPASS_SECRET }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_USERNAME_2: ${{ secrets.TEST_USERNAME_2 }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npm test -- ${{ matrix.group.files }}
        working-directory: tests

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-screenshots-${{ matrix.group.name }}
          path: tests/test-results/
          retention-days: 7

  e2e-control2:
    if: ${{ github.event.inputs.spec_filter == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: tests

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./node_modules/@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
        working-directory: tests

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: tests

      # Liczba workerów = liczba kont w puli CONTROL2_TEST_ACCOUNTS (po
      # przecinku) — każdy worker loguje się na inne konto (patrz
      # loginAsControl2TestUser w e2e/helpers/login.js), więc żaden nie
      # czeka w kolejce za innym. Brak/pusty sekret -> 1 worker na
      # TEST_USERNAME, jak dziś.
      - name: Run E2E tests (control2, workers = rozmiar puli kont)
        env:
          E2E_BYPASS_SECRET: ${{ secrets.E2E_BYPASS_SECRET }}
          CONTROL2_TEST_ACCOUNTS: ${{ secrets.CONTROL2_TEST_ACCOUNTS }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          IFS=',' read -ra ACCS <<< "$CONTROL2_TEST_ACCOUNTS"
          WORKERS=${#ACCS[@]}
          if [ "$WORKERS" -lt 1 ]; then WORKERS=1; fi
          echo "Pula kont control2: $WORKERS worker(ów)"
          npx playwright test e2e/control2.spec.js --workers="$WORKERS"
        working-directory: tests

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-screenshots-control2
          path: tests/test-results/
          retention-days: 7

  e2e-custom-filter:
    if: ${{ github.event.inputs.spec_filter != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: tests

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./node_modules/@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
        working-directory: tests

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: tests

      - name: Run E2E tests (spec_filter)
        env:
          E2E_BYPASS_SECRET: ${{ secrets.E2E_BYPASS_SECRET }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_USERNAME_2: ${{ secrets.TEST_USERNAME_2 }}
          CONTROL2_TEST_ACCOUNTS: ${{ secrets.CONTROL2_TEST_ACCOUNTS }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npm test -- ${{ github.event.inputs.spec_filter }}
        working-directory: tests

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-screenshots
          path: tests/test-results/
          retention-days: 7
