name: E2E Tests (Playwright)

on:
  workflow_dispatch:
    inputs:
      spec_filter:
        description: 'Opcjonalnie: odpal tylko wybrany plik/wzorzec (np. "e2e/nowy-test.spec.js" albo "--grep nazwa"). Puste = wszystkie testy, w równoległych grupach (patrz niżej). To pole jest najczęściej używane -- pojedynczy plik/wzorzec zamiast całego zestawu.'
        required: false
        default: ""
      unit_filter:
        description: 'Opcjonalnie: rozdzielone spacją pliki testów unit, np. "unit/rounds.engine.test.js unit/final.engine.test.js". Puste = cały zestaw unit.'
        required: false
        default: ""
      workers:
        description: 'Liczba workerów; 1 do diagnostyki współdzielonych kont i poczty.'
        required: false
        default: "4"
      test_accounts:
        description: 'Opcjonalna, odizolowana pula kont, np. 4,5. Pusta wartość używa zwykłej puli bez kont zarezerwowanych.'
        required: false
        default: ""
      e20_gallery_pages:
        description: 'Opcjonalnie: ID stron galerii E20 rozdzielone przecinkami. Puste = wszystkie strony.'
        required: false
        default: ""
      e20_gallery_profiles:
        description: 'Opcjonalnie: profile galerii E20 rozdzielone przecinkami. Puste = wszystkie urządzenia.'
        required: false
        default: ""
      e20_gallery_accounts:
        description: 'Istniejące konta testowe do galerii E20, np. 1,2,3. Widoki jednego konta są sekwencyjne; konta pracują równolegle.'
        required: false
        default: "2"
      publish_mail_screenshots:
        description: 'Publikuj zrzuty /mails/ w docs po udanym punktowym teście.'
        type: boolean
        required: false
        default: false
      publish_anonymous_screenshots:
        description: 'Publikuj zrzuty anonimowych ankiet i stanów linków po udanym punktowym teście.'
        type: boolean
        required: false
        default: false
      retain_statistics_games:
        description: 'Zachowaj gry, których rekordy statystyk odczytano w wybranych testach Control2, do ręcznego sprawdzenia w panelu.'
        type: boolean
        required: false
        default: false
      publish_transfer_screenshots:
        description: 'Publikuj zrzuty zakończenia importu gry po udanym punktowym teście.'
        type: boolean
        required: false
        default: false
      publish_resource_copy_screenshots:
        description: 'Publikuj zrzuty Wyślij Gry/Logo po udanym punktowym teście.'
        type: boolean
        required: false
        default: false

# WAŻNE: celowo tylko workflow_dispatch — ani push, ani pull_request.
# Ten workflow loguje się na prawdziwe konta na produkcji i ma dostęp do
# E2E_BYPASS_SECRET/TEST_PASSWORD; odpalany wyłącznie ręcznie, świadomie,
# kiedy faktycznie trzeba: Actions → "E2E Tests (Playwright)" → Run
# workflow. Pole "spec_filter" pozwala odpalić wyrywkowo tylko jeden
# plik/wzorzec zamiast całego zestawu (wtedy leci jeden job,
# e2e-custom-filter, bez podziału na grupy niżej) -- to zdecydowanie
# najczęstszy sposób odpalania.
#
# TYLKO DWA SEKRETY W OGÓLE: E2E_BYPASS_SECRET (omija Turnstile) i
# TEST_PASSWORD (wspólne hasło wszystkich kont testowych). Loginy kont
# testowych to zawsze wzorzec test<N>@familiada.online -- domena jest
# stałą w kodzie (e2e/helpers/login.js), nie sekretem, bo produkcja to
# zawsze ta sama domena i sam login bez prawdziwego hasła niczego nie
# odsłania. Zero sekretu z listą loginów, zero osobnego konta "głównego".
#
# JEDEN SILNIK TESTÓW, JEDNA KOMENDA WSZĘDZIE: ten sam playwright.config.js,
# ta sama `playwright test ... --workers="$TEST_WORKERS"` w KAŻDEJ grupie
# e2e-grouped i w e2e-custom-filter -- bez żadnego "jeśli to ten plik, to
# inaczej". Zwykła pula kont test1@…...test8@… (test9/test10 wyłączone —
# druga sesja). Równoległe lżejsze przebiegi: każdy z rozłącznym zestawem
# kont przez wejście `test_accounts` (np. 1,2,3 i 4,5,6).
# TEST_ACCOUNT_COUNT określa górny numer zwykłej puli — patrz
# getTestAccountPool w e2e/helpers/login.js. Pula jest
# dostępna w CAŁOŚCI każdemu filtrowi/grupie, bez sztywnego podziału
# między plikami — który dokładnie numer trafia do którego testu decyduje
# kod TEGO pliku (np. control2.spec.js woła loginAsPooledTestUser z
# testInfo.parallelIndex; base-explorer.spec.js/bases.spec.js jawnie
# wybierają testAccountUsername(1)/(2) na dwa jednocześnie zalogowane
# konta w tym samym teście).
#
# WAŻNE, znalezione na własnej skórze (run #122, 12/16 testów control2
# failed, 57 minut): TEST_ACCOUNT_COUNT (rozmiar puli kont) i TEST_WORKERS
# (realna liczba RÓWNOLEGŁYCH workerów Playwrighta) to CELOWO DWIE RÓŻNE
# liczby, nie jedna. Runner GitHub Actions (ubuntu-latest) ma ograniczoną
# liczbę rdzeni, a każdy POJEDYNCZY test control2.spec.js sam otwiera do 4
# kontekstów przeglądarki naraz (Control+Display+Host+Buzzer) -- przy
# --workers=10 to do 40 jednoczesnych instancji Chromium na jednej
# maszynie. Runner fizycznie nie nadążał renderować strony w czasie, na
# jaki czekał Playwright -- stąd masowe "element is not stable"/"element
# is not enabled" i timeouty, NIE błąd logiki testów. TEST_ACCOUNT_COUNT
# może bezpiecznie zostać wysoki (więcej kont w pogotowiu na przyszłość,
# np. mocniejszy runner) -- to TEST_WORKERS reguluje faktyczne obciążenie
# i musi zostać niski. Podnoś TEST_WORKERS ostrożnie, po jednym, sprawdzając
# realny wynik, nie zgadując.
#
# Reszta testów (game-deletion, editor, cross-resource-locks, ...) używa
# domyślnego loginAsTestUser bez jawnego username -> zawsze test1, więc
# idzie szeregowo w swojej grupie (workers:1 z playwright.config.js jest
# używane tylko lokalnie/poza CI — w CI workers zawsze nadpisuje ten
# jeden, wspólny --workers).
# Podniesione 2 -> 4 na wyraźną prośbę (2026-09-17), żeby skrócić czas
# przebiegu -- 4 workery x do 4 kontekstów/test = do 16 jednoczesnych
# Chromium, wciąż wyraźnie poniżej 40, które przeciążyło runner w run #122.
# Po jednym czystym przebiegu na workers=4 (run #131, ~21 min, brak
# objawów przeciążenia) podniesione ostrożnie 4 -> 5 (2026-09-17) -- do 20
# jednoczesnych Chromium, nadal wyraźnie poniżej progu 40.
# Cofnięte 5 -> 4 (2026-10-02): dokładnie przewidziany tu sygnał się
# pojawił -- control2.spec.js (po przybyciu testów 17 -> 21 od ostatniej
# kalibracji) dał TRZY kolejne pełne przebiegi (run #290/#291/#292) z
# identycznym, powtarzalnym timeoutem na DWÓCH tych samych testach
# (physicalBuzzer's checkbox.check(), zerwanie-połączenia's dot status) --
# bez żadnej zmiany w logice, którą dałoby się za to winić (sprawdzone:
# ani jeden, ani drugi test nie dotyka kodu zmienianego w tej sesji).
# Jeśli znowu pojawi się masowe "element is not stable"/"not enabled" przy
# workers=4, to sygnał żeby cofnąć o kolejny krok (4 -> 2), nie iść dalej w
# górę bez kolejnego czystego przebiegu na obecnej wartości.
env:
  TEST_BRANCH_CODE: ${{ github.ref_name != 'main' && '1' || '0' }}
  TEST_ACCOUNT_COUNT: "8"
  TEST_ACCOUNT_NUMBERS: ${{ inputs.test_accounts || '' }}
  TEST_WORKERS: ${{ inputs.workers || '4' }}

jobs:
  e2e-grouped:
    if: ${{ github.event.inputs.spec_filter == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: konto-glowne
            files: >-
              e2e/game-deletion.spec.js e2e/restore-demo.spec.js
              e2e/cross-resource-locks.spec.js
              e2e/editor.spec.js e2e/game-settings.spec.js
              e2e/game-state-realtime-spike.spec.js e2e/polls.spec.js
              e2e/poll-qr.spec.js e2e/poll-voting.spec.js e2e/go.spec.js
          - name: konto-drugie
            files: e2e/base-explorer.spec.js e2e/bases.spec.js
          - name: goscie-i-statyka
            files: >-
              e2e/account-deletion.spec.js e2e/guest-migration.spec.js
              e2e/static-assets-routing.spec.js e2e/games-rename.spec.js
          - name: konto-email
            files: e2e/account-password-email.spec.js
          - name: control2
            files: e2e/control2.spec.js

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: tests

      # Cache samych binarek przeglądarki (~/.cache/ms-playwright) osobno od
      # npm cache powyżej — klucz po wersji @playwright/test z package-lock,
      # więc bump wersji automatycznie unieważnia cache i ściąga nową. Playwright
      # CLI samo wykrywa już obecne binarki i pomija ich pobieranie (nawet bez
      # tego kroku by nie pobrał drugi raz w tym samym jobie) — cache pozwala to
      # wykryć MIĘDZY uruchomieniami, bo każdy run zaczyna na świeżej maszynie.
      # System deps (apt, --with-deps) i tak instalują się na nowo za każdym
      # razem — ta VM resetuje się między runami, nic tu nie da się scache'ować.
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./node_modules/@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
        working-directory: tests

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: tests

      # Cloudflare Bot Fight Mode jest na stałe wyłączony w dashboardzie
      # (Security → Bots) — na Free planie nie da się go pominąć per-request
      # (nie działa na silniku reguł, WAF Custom Rules/Configuration Rules go
      # nie dotyczą), więc jedyną opcją było albo płacić, albo wyłączyć na
      # stałe. Turnstile na /login (osobny mechanizm, patrz e2e-token.js)
      # zostaje jako właściwa ochrona przed botami przy logowaniu.
      - name: Run E2E tests (${{ matrix.group.name }})
        env:
          E2E_BYPASS_SECRET: ${{ secrets.E2E_BYPASS_SECRET }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npx playwright test ${{ matrix.group.files }} --workers="$TEST_WORKERS"
        working-directory: tests

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-screenshots-${{ matrix.group.name }}
          path: tests/test-results/
          retention-days: 7

  e2e-custom-filter:
    permissions:
      contents: write
    if: ${{ github.event.inputs.spec_filter != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: tests

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./node_modules/@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
        working-directory: tests

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: tests

      - name: Unit tests (pointwise when selected)
        env:
          UNIT_FILTER: ${{ inputs.unit_filter }}
        working-directory: tests
        run: |
          if [ -n "$UNIT_FILTER" ]; then
            read -r -a unit_files <<< "$UNIT_FILTER"
            for file in "${unit_files[@]}"; do
              case "$file" in
                unit/*.test.js) ;;
                *) echo "Nieprawidłowa ścieżka testu unit: $file" >&2; exit 2 ;;
              esac
            done
            node --test --test-concurrency=1 "${unit_files[@]}"
          else
            node --test --test-concurrency=1 unit/*.test.js
          fi

      - name: Prepare E20 session and read existing account data
        if: ${{ success() && contains(inputs.spec_filter, 'e2e/e20-gallery.spec.js') }}
        env:
          E2E_BYPASS_SECRET: ${{ secrets.E2E_BYPASS_SECRET }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          E20_GALLERY_ACCOUNTS: ${{ inputs.e20_gallery_accounts || '2' }}
        run: node e2e/helpers/prepare-e20-gallery.js
        working-directory: tests

      - name: Run E2E tests (spec_filter)
        env:
          E2E_BYPASS_SECRET: ${{ secrets.E2E_BYPASS_SECRET }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          KEEP_STATISTICS_GAMES: ${{ inputs.retain_statistics_games && '1' || '0' }}
          E20_GALLERY_PAGES: ${{ inputs.e20_gallery_pages || '' }}
          E20_GALLERY_PROFILES: ${{ inputs.e20_gallery_profiles || '' }}
          E20_GALLERY_ACCOUNTS: ${{ inputs.e20_gallery_accounts || '2' }}
          IS_E20_GALLERY: ${{ contains(inputs.spec_filter, 'e2e/e20-gallery.spec.js') && '1' || '0' }}
        run: |
          if [ "$IS_E20_GALLERY" = "1" ]; then
            npx playwright test e2e/e20-gallery.spec.js --workers="$TEST_WORKERS" --retries=0
          else
            npx playwright test ${{ github.event.inputs.spec_filter }} --workers="$TEST_WORKERS"
          fi
        working-directory: tests

      - name: Validate E20 screenshot folders
        if: ${{ always() && contains(inputs.spec_filter, 'e2e/e20-gallery.spec.js') }}
        env:
          E20_GALLERY_PAGES: ${{ inputs.e20_gallery_pages || '' }}
          E20_GALLERY_PROFILES: ${{ inputs.e20_gallery_profiles || '' }}
        run: node scripts/agent-tools/build-e20-gallery.cjs

      - name: Upload production statistics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-statistics-records
          path: tests/test-results/**/statistics-*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-screenshots
          path: tests/test-results/
          retention-days: 7

      # Zrzuty robione celowo przez testy (testInfo.outputPath("shot-*.png"),
      # np. podgląd nowego wyglądu w editor.spec.js) -- też przy sukcesie.
      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: tests/test-results/**/shot-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload E20 gallery
        if: ${{ always() && contains(inputs.spec_filter, 'e2e/e20-gallery.spec.js') }}
        uses: actions/upload-artifact@v4
        with:
          name: e20-gallery-${{ github.run_number }}
          path: tests/test-results/e20-gallery/
          if-no-files-found: warn
          retention-days: 30

      - name: Remove temporary E20 authentication state
        if: ${{ always() && contains(inputs.spec_filter, 'e2e/e20-gallery.spec.js') }}
        run: rm -f "$RUNNER_TEMP"/familiada-e20-gallery-test*-auth.json "$RUNNER_TEMP"/familiada-e20-gallery-test*-data.json

      - name: Publish requested anonymous poll screenshots
        if: ${{ success() && inputs.publish_anonymous_screenshots && (contains(inputs.spec_filter, 'e2e/poll-anonymous.spec.js') || contains(inputs.spec_filter, 'e2e/poll-anonymous-layout.spec.js') || contains(inputs.spec_filter, 'e2e/poll-go.spec.js') || contains(inputs.spec_filter, 'e2e/go-states.spec.js')) }}
        env:
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_SHA: ${{ github.sha }}
        run: |
          python3 scripts/agent-tools/publish-anonymous-screenshots.py
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/img/poll-anonymous
          if ! git diff --cached --quiet; then
            node --test --test-concurrency=1 tests/unit/*.test.js
            git commit -m "docs(polls): anonymous browser cooldown screenshots [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Publish requested transfer screenshots
        if: ${{ success() && inputs.publish_transfer_screenshots && contains(inputs.spec_filter, 'e2e/game-transfer-format.spec.js') }}
        env:
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_SHA: ${{ github.sha }}
        run: |
          python3 scripts/agent-tools/publish-transfer-screenshots.py
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/img/transfer/game-import
          if ! git diff --cached --quiet; then
            node --test --test-concurrency=1 tests/unit/*.test.js
            git commit -m "docs(games): native import completion screenshots [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Publish requested duplication screenshots
        if: ${{ success() && inputs.publish_transfer_screenshots && contains(inputs.spec_filter, 'e2e/resource-duplicate-ui.spec.js') }}
        env:
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_SHA: ${{ github.sha }}
        run: |
          python3 scripts/agent-tools/publish-duplicate-screenshots.py
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/img/transfer/duplicate
          if ! git diff --cached --quiet; then
            node --test --test-concurrency=1 tests/unit/*.test.js
            git commit -m "docs(resources): duplication screenshots [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Publish requested resource copy send screenshots
        if: ${{ success() && inputs.publish_resource_copy_screenshots && contains(inputs.spec_filter, 'e2e/resource-copy-send.spec.js') }}
        env:
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_SHA: ${{ github.sha }}
        run: |
          python3 scripts/agent-tools/publish-resource-copy-send-screenshots.py
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/img/transfer/resource-copy-send
          if ! git diff --cached --quiet; then
            node --test tests/unit/navButtons.test.js tests/unit/pageInit.test.js tests/unit/notification-reference.test.js tests/unit/goContract.test.js tests/unit/duplicateResource.test.js tests/unit/resourceDuplicateApi.test.js
            git commit -m "docs(resources): publish send flow screenshots [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Publish requested mail screenshots
        if: ${{ success() && inputs.publish_mail_screenshots && contains(inputs.spec_filter, 'e2e/mail-center.spec.js') }}
        env:
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_SHA: ${{ github.sha }}
        run: |
          python3 scripts/agent-tools/publish-mail-screenshots.py
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/img/mail-center/live
          if ! git diff --cached --quiet; then
            node --test --test-concurrency=1 tests/unit/*.test.js
            git commit -m "docs(mail): production review screenshots [skip ci]"
            git pull --rebase
            git push
          fi
