name: Maintenance status (przerwa techniczna — tylko odczyt)

# Stan przerwy technicznej (Cloudflare KV „state”) i aktywność użytkowników
# (liczby, rola agent_reader) — tylko odczyt. Przerwę włącza i wyłącza
# wyłącznie właściciel w panelu admina (decyzja użytkownika 2026-10-20);
# agent prosi o nią i sprawdza tu stan oraz to, czy ktoś pracuje
# (scripts/db-read/maintenance-blockers.sql). Repo publiczne: w logu tylko
# liczby i stan przerwy.

permissions:
  contents: read

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/maintenance-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm ci

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SERVER_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts  # odcisk przypięty (nowy serwer)

      - name: Activity (liczby)
        id: activity
        working-directory: .
        env:
          PSQL_CMD: ssh -i ~/.ssh/id_ed25519 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} sudo familijna-psql reader
          DB_READ_TUPLES: '1'
          DB_READ_NO_NOTICE: '1'
        run: |
          ROW=$(scripts/db-read.sh scripts/db-read/maintenance-blockers.sql | tail -n 1)
          IFS='|' read -r USERS CONTROL EDIT EDIT_PAGES VOTES NOW <<< "$ROW"
          BLOCKERS=""
          [ "${CONTROL:-0}" != 0 ] && BLOCKERS="$BLOCKERS gry w Control: $CONTROL,"
          [ "${EDIT:-0}" != 0 ] && BLOCKERS="$BLOCKERS blokady edycji: $EDIT,"
          [ "${EDIT_PAGES:-0}" != 0 ] && BLOCKERS="$BLOCKERS osoby w edytorach/ustawieniach/ankietach: $EDIT_PAGES,"
          [ "${VOTES:-0}" != 0 ] && BLOCKERS="$BLOCKERS głosy w ankietach (10 min): $VOTES,"
          echo "blockers=${BLOCKERS%,}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Aktywność::użytkownicy (90 s): $USERS, gry w Control: $CONTROL, blokady edycji: $EDIT, osoby w edytorach: $EDIT_PAGES, głosy (10 min): $VOTES"

      - name: Status
        run: |
          # błąd odczytu (np. token bez dostępu do KV) przerywa przebieg
          npx wrangler kv key get state --binding MAINT_KV --remote > /tmp/raw.txt
          # sam JSON (bez ewentualnego banera wranglera)
          sed -n '/^{/,$p' /tmp/raw.txt > /tmp/state.json
          jq -e 'type == "object" and has("enabled")' /tmp/state.json > /dev/null \
            || { echo "::error title=Przerwa::nie udało się odczytać stanu z KV"; exit 1; }
          SUMMARY=$(jq -c '{enabled, mode, returnAt}' /tmp/state.json)
          echo "::notice title=Przerwa::$SUMMARY"
