name: Deploy Cloudflare Worker

on:
  push:
    branches: ["main"]
    paths:
      - "cloudflare/**"
      - "web/shared/js/core/go-contract.js"
      - "web/shared/js/core/resource-clone-plan.js"
      - "web/shared/js/core/base-transfer-format.js"
      - "web/shared/js/core/game-transfer-format.js"
      - "web/shared/js/core/logo-transfer-source.js"
      - "web/shared/js/core/logo-image-data.js"
      - "web/logo/js/package.js"
      - "web/logo/js/render.js"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci
        working-directory: cloudflare/maintenance-worker

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare/maintenance-worker
