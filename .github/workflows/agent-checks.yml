name: Agent checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests (one file at a time)
        working-directory: tests
        run: node --test --test-concurrency=1 unit/*.test.js
