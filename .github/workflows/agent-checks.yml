name: Agent checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control2-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: statistics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Test Control 2 session migration and diagnostics in isolated PostgreSQL
        env:
          PGPASSWORD: test-only-password
        run: psql -h localhost -U postgres -d statistics_test -v ON_ERROR_STOP=1 -f tests/sql/control2-sessions.sql
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests (one file at a time)
        working-directory: tests
        run: node --test --test-concurrency=1 unit/*.test.js
