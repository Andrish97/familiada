name: Go isolated identity contracts
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/go-contract-checks.yml'
      - 'supabase/migrations/*363*'
      - 'docs/sql/*363*'
permissions:
  contents: read
jobs:
  verify-go-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: fam363isolated
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: fam363isolated
      PGPASSWORD: isolated-test-password
    steps:
      - uses: actions/checkout@v4
      - name: Restore immutable production schema before363
        run: |
          git fetch --no-tags --depth=1 origin b1eb9d1e458b00113dbdef2de0e5ec1f8a3bf6c7
          git show b1eb9d1e458b00113dbdef2de0e5ec1f8a3bf6c7:supabase/schema.sql > /tmp/pre-go-schema.sql
          psql -v ON_ERROR_STOP=1 -f docs/sql/local-stubs.sql
          psql -v ON_ERROR_STOP=1 -c 'ALTER EXTENSION pg_trgm SET SCHEMA public'
          sed -e 's/"public"\."vector"(384)/real[]/g' -e 's/"p_embedding" "public"\."vector"/"p_embedding" real[]/' -e '/market_games_embedding_ivfflat_idx/d' -e '/transaction_timeout/d' -e '/CREATE SCHEMA "public";/d' /tmp/pre-go-schema.sql > /tmp/go-schema.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/go-schema.sql > /tmp/go-restore.log 2>&1
          psql -v ON_ERROR_STOP=1 -f docs/sql/restore-identity-auth-triggers-358.sql
      - name: Apply final additive migration and rollback contract
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/2026-10-12_363_go_canonical_recipient.sql
          psql -v ON_ERROR_STOP=1 -f docs/sql/test-go-canonical-recipient-363.sql
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-isolated-restore
          path: /tmp/go-restore.log
