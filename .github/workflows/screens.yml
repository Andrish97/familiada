name: Zrzuty stron (dane demo)

# Zrzuty prawdziwych stron z web/ na danych demo (scripts/screens/) -- bez kont,
# bez produkcyjnej bazy. Automatycznie po każdym pushu zmieniającym strony albo
# system zrzutów (sceny zmienionych stron), ręcznie z Actions → „Zrzuty stron”.
# Wynik: artefakt z galerią (index.html + README.md) i galeria na gałęzi
# screens-gallery (link w podsumowaniu przebiegu, działa też na telefonie).
# Commity CI z [skip ci] (np. wersje ?v=) nie uruchamiają workflowu.
on:
  push:
    branches-ignore: [screens-gallery]
    paths: ["web/**", "scripts/screens/**", ".github/workflows/screens.yml"]
  workflow_dispatch:
    inputs:
      scenes:
        description: "Sceny: changed (zmienione względem main), all albo lista po przecinku (np. games,logos)"
        default: "changed"
        required: true
      lang:
        description: "Języki: pl, en, uk, all albo lista"
        default: "pl"
        required: true
      devices:
        description: "Urządzenia: desktop,phone,tablet,phone-landscape"
        default: "desktop,phone"
        required: true
      publish:
        description: "Opublikuj galerię na gałęzi screens-gallery"
        type: boolean
        default: true
      homepage:
        description: "Odśwież wszystkie kadry strony głównej i wdróż (tylko z main)"
        type: boolean
        default: false
      help:
        description: "Odśwież wszystkie zrzuty Wskazówek (/manual/) i wdróż (tylko z main)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

# Na main przebieg nie jest przerywany kolejnym pushem (kolejny czeka; z kilku
# czekających zostaje najnowszy) -- inaczej przy częstych pushach kilku sesji
# długie odświeżanie zrzutów nigdy się nie kończyło. Porównanie z ostatnim
# odświeżeniem zrzutów przez CI (kroki niżej) nie gubi zmian z pominiętych przebiegów;
# które sceny -- scripts/screens/changes.cjs (bez samych wersji ?v=, wspólny kod
# tylko dla stron, które go wczytują).
concurrency:
  group: screens-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: tests

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./node_modules/@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
        working-directory: tests

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: tests

      # Strony używają czcionki systemowej (system-ui). Na Ubuntu to DejaVu Sans --
      # zrzuty wyglądałyby inaczej niż na urządzeniach użytkowników i w lokalnym
      # podglądzie; Inter jako czcionka systemowa (jak w środowisku agentów).
      - name: Czcionka systemowa (Inter)
        run: |
          sudo apt-get install -y -qq fonts-inter >/dev/null
          mkdir -p ~/.config/fontconfig
          cat > ~/.config/fontconfig/fonts.conf <<'XML'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <alias><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
            <alias><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
          </fontconfig>
          XML
          fc-cache -f >/dev/null
          echo "system-ui: $(fc-match system-ui)"

      # Galeria do przeglądu: przy pushu tylko PL i najwyżej 30 min -- zmiana
      # tłumaczeń dotyczy wszystkich scen (3 języki nie mieszczą się w limicie
      # przebiegu), a kroki strony głównej i Wskazówek niżej muszą się wykonać.
      - name: Zrzuty
        timeout-minutes: 30
        continue-on-error: true
        env:
          SCENES: ${{ inputs.scenes || 'changed' }}
          LANGS: ${{ inputs.lang || (github.event_name == 'push' && 'pl') || 'all' }}
          DEVICES: ${{ inputs.devices || 'desktop,phone' }}
          # Push na main: zmiany tego pushu; inne gałęzie i ręcznie: względem main.
          BASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before || 'origin/main' }}
        run: |
          case "$SCENES" in
            changed) pick="--changed --base=$BASE" ;;
            all) pick="--all" ;;
            *) pick="--scenes=$SCENES" ;;
          esac
          node scripts/screens/run.cjs $pick --lang="$LANGS" --devices="$DEVICES" --out=screens-out

      - name: Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-${{ github.run_number }}
          path: screens-out
          if-no-files-found: ignore

      - name: Publikacja na screens-gallery
        if: (github.event_name == 'push' || inputs.publish) && hashFiles('screens-out/README.md') != ''
        env:
          RUN_DIR: ${{ github.ref_name }}/${{ github.run_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/gallery && mkdir -p /tmp/gallery
          if git ls-remote --exit-code origin screens-gallery >/dev/null; then
            git clone --depth 1 --branch screens-gallery "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" /tmp/gallery
          else
            git -C /tmp/gallery init -b screens-gallery
            git -C /tmp/gallery remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          fi
          mkdir -p "/tmp/gallery/$RUN_DIR"
          cp -r screens-out/. "/tmp/gallery/$RUN_DIR/"
          cd /tmp/gallery
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Zrzuty $RUN_DIR [skip ci]"
          git push origin screens-gallery
          echo "### Galeria: https://github.com/${{ github.repository }}/blob/screens-gallery/$RUN_DIR/README.md" >> "$GITHUB_STEP_SUMMARY"

      # Strona główna czyta kadry z web/assets/img/<język>/shots/ i og-image.
      # Push na main zmieniający te kadry: odświeżyć je, zapisać na main i
      # wywołać wdrożenie Pages (push z tokenem CI sam go nie uruchamia).
      - name: Kadry strony głównej (main)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.homepage)
        env:
          BASE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          ALL: ${{ inputs.homepage && '1' || '' }}
        run: |
          # Zmiany liczą się od kodu, z którego CI ostatnio renderowało kadry (stopka
          # Rendered-From: w commicie odświeżenia), nie od samego commita: ten trafia na
          # main przez rebase, więc pod nim leżą commity innych sesji, których CI nie
          # renderowało. Przebieg anulowany przez kolejny push nie gubi zmian, a ręczna
          # publikacja części kadrów w commicie sesji nie przesuwa punktu odniesienia.
          # Brak stopki -- wszystkie kadry.
          RENDERED=$(git rev-parse HEAD)
          LAST=$(git log -1 --format=%H --author="github-actions" HEAD -- web/assets/img/pl/shots web/assets/img/en/shots web/assets/img/uk/shots 2>/dev/null || true)
          FROM=$([ -n "$LAST" ] && git log -1 --format='%(trailers:key=Rendered-From,valueonly)' "$LAST" | head -1 || true)
          if [ -n "$FROM" ] && git cat-file -e "$FROM^{commit}" 2>/dev/null; then BASE="$FROM"; else ALL=1; fi
          if [ -n "$ALL" ]; then echo "Punkt odniesienia: brak -- wszystkie kadry"; else echo "Punkt odniesienia: $BASE"; fi
          if [ -n "$ALL" ]; then pick="--all"; else pick="--changed --base=$BASE"; fi
          node scripts/screens/run.cjs $pick --homepage --lang=all --out=home-out || true
          [ -d home-out ] || { echo "Brak zmienionych kadrów strony głównej."; exit 0; }
          node scripts/screens/publish-homepage.cjs --out=home-out
          git add web/assets/img
          if git diff --cached --quiet; then echo "Kadry bez zmian."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh homepage screenshots [skip ci]" -m "Rendered-From: $RENDERED"
          # Inne sesje pushują na main równolegle -- kilka prób rebase + push.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 5))
          done
          gh workflow run deploy-pages.yml --ref main

      # Wskazówki (/manual/) czytają zrzuty z web/manual/img/<język>/ — tylko sceny
      # użyte w treści (![Podpis](zrzut:scena) w docs/podrecznik). Push na main
      # zmieniający ich strony: odświeżyć, zapisać na main i wdrożyć Pages.
      - name: Zrzuty Wskazówek (main)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.help)
        env:
          BASE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          ALL: ${{ inputs.help && '1' || '' }}
        run: |
          git pull --rebase origin main || true
          # Punkt odniesienia jak w kadrach strony głównej: kod z ostatniego renderowania
          # (stopka Rendered-From:), brak stopki -- wszystkie zrzuty Wskazówek.
          RENDERED=$(git rev-parse HEAD)
          LAST=$(git log -1 --format=%H --author="github-actions" HEAD -- web/manual/img 2>/dev/null || true)
          FROM=$([ -n "$LAST" ] && git log -1 --format='%(trailers:key=Rendered-From,valueonly)' "$LAST" | head -1 || true)
          if [ -n "$FROM" ] && git cat-file -e "$FROM^{commit}" 2>/dev/null; then BASE="$FROM"; else ALL=1; fi
          if [ -n "$ALL" ]; then echo "Punkt odniesienia: brak -- wszystkie zrzuty"; else echo "Punkt odniesienia: $BASE"; fi
          if [ -n "$ALL" ]; then pick=$(node scripts/screens/publish-manual.cjs --list); else pick=$(node scripts/screens/publish-manual.cjs --list --base="$BASE"); fi
          [ -n "$pick" ] || { echo "Brak zrzutów Wskazówek do odświeżenia."; exit 0; }
          node scripts/screens/run.cjs --scenes="$pick" --lang=all --devices=desktop,phone,phone-landscape,tablet,tablet-landscape --out=help-out || true
          node scripts/screens/publish-manual.cjs --out=help-out
          # Treść ma wymiary obrazów (width/height) — po nowych zrzutach generuje się od nowa.
          node scripts/manual/build-content.mjs
          git add web/manual/img web/manual/content
          if git diff --cached --quiet; then echo "Zrzuty Wskazówek bez zmian."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh help screenshots [skip ci]" -m "Rendered-From: $RENDERED"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 5))
          done
          gh workflow run deploy-pages.yml --ref main
