name: Rotate secrets (jednorazowy)

# Jednorazowe ustawienie sekretów z audytu bezpieczeństwa („Wymagane przed
# wdrożeniem”, zgoda właściciela 2026-10-21). Wartości powstają tutaj
# (openssl rand), są od razu maskowane i nigdzie nie są wypisywane; do
# serwera idą przez stdin. W logu tylko wartości logiczne. Do usunięcia po
# przebiegu.
#   GENERATE_GAME_SECRET: Worker (sekret), env funkcji Edge (docker/.env +
#     override.yml), Vault `generate_game_secret`.
#   LEAD_FINDER_API_KEY (nowy): Worker (sekret), docker/.env (lead-finder
#     i funkcje Edge).

permissions:
  contents: read

on:
  workflow_dispatch: {}

concurrency:
  group: rotate-secrets
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate (masked)
        run: |
          umask 077
          GG=$(openssl rand -hex 32); echo "::add-mask::$GG"
          LF=$(openssl rand -hex 32); echo "::add-mask::$LF"
          [ ${#GG} -eq 64 ] && [ ${#LF} -eq 64 ]
          printf '%s\n%s\n' "$GG" "$LF" > "$RUNNER_TEMP/vals"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        working-directory: cloudflare/maintenance-worker
        run: npm ci

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Server preflight (write access, no changes)
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" 'bash -s' <<'EOS'
          set -euo pipefail
          D=~/supabase-selfhost/supabase/docker
          [ -w "$D/.env" ] || { echo "::error::.env nie do zapisu"; exit 1; }
          [ -w "$D/docker-compose.override.yml" ] || { echo "::error::override.yml nie do zapisu"; exit 1; }
          [ -w "$D" ] || { echo "::error::katalog docker nie do zapisu"; exit 1; }
          grep -qE '^[[:space:]]+MAIL_WORKER_SECRET: \$\{MAIL_WORKER_SECRET\}[[:space:]]*$' "$D/docker-compose.override.yml" || { echo "::error::brak kotwicy MAIL_WORKER_SECRET w override.yml"; exit 1; }
          [ "$(grep -c '^LEAD_FINDER_API_KEY=' "$D/.env")" = 1 ] || { echo "::error::LEAD_FINDER_API_KEY w .env nie jest pojedynczą linią"; exit 1; }
          [ "$(grep -c '^GENERATE_GAME_SECRET=' "$D/.env")" -le 1 ]
          docker ps -q --filter name=supabase-db | grep -q .
          echo "preflight ok"
          EOS

      - name: Worker secrets
        working-directory: cloudflare/maintenance-worker
        run: |
          { read -r GG; read -r LF; } < "$RUNNER_TEMP/vals"
          printf '%s' "$GG" | npx wrangler secret put GENERATE_GAME_SECRET > /dev/null
          printf '%s' "$LF" | npx wrangler secret put LEAD_FINDER_API_KEY > /dev/null
          npx wrangler secret list --format json > "$RUNNER_TEMP/names.json"
          G=$(jq -r 'map(.name) | index("GENERATE_GAME_SECRET") != null' "$RUNNER_TEMP/names.json")
          L=$(jq -r 'map(.name) | index("LEAD_FINDER_API_KEY") != null' "$RUNNER_TEMP/names.json")
          echo "::notice title=Worker::GENERATE_GAME_SECRET ustawiony: $G, LEAD_FINDER_API_KEY ustawiony: $L"
          [ "$G" = true ] && [ "$L" = true ]

      - name: Server env + Vault (values via stdin)
        run: |
          cat > "$RUNNER_TEMP/rot.sh" <<'EOS'
          set -euo pipefail
          umask 077
          read -r GG; read -r LF
          [ ${#GG} -eq 64 ] && [ ${#LF} -eq 64 ]
          D=~/supabase-selfhost/supabase/docker
          ENV="$D/.env"; OVR="$D/docker-compose.override.yml"
          TS=$(date +%Y%m%d%H%M%S)
          cp -p "$ENV" "$ENV.bak-rotate-$TS"
          cp -p "$OVR" "$OVR.bak-rotate-$TS"
          # upsert KEY=VAL (wartość przez środowisko, nie argv); zapis w miejscu
          # (cat >) zachowuje i-węzeł, właściciela i uprawnienia
          upsert() {
            local T; T=$(mktemp "$ENV.tmp.XXXXXX")
            K="$1" V="$2" awk 'BEGIN{k=ENVIRON["K"]; v=ENVIRON["V"]; d=0}
              index($0, k"=")==1 { if(!d){print k"="v; d=1}; next } {print}
              END{ if(!d) print k"="v }' "$ENV" > "$T"
            cat "$T" > "$ENV"; rm -f "$T"
          }
          upsert GENERATE_GAME_SECRET "$GG"
          upsert LEAD_FINDER_API_KEY "$LF"
          # override.yml: GENERATE_GAME_SECRET w env usługi functions
          if ! grep -qE '^[[:space:]]+GENERATE_GAME_SECRET:' "$OVR"; then
            T=$(mktemp "$OVR.tmp.XXXXXX")
            awk '{print} /^[[:space:]]+MAIL_WORKER_SECRET: \$\{MAIL_WORKER_SECRET\}[[:space:]]*$/ && !d { match($0,/^[[:space:]]+/); printf "%sGENERATE_GAME_SECRET: ${GENERATE_GAME_SECRET}\n", substr($0,1,RLENGTH); d=1 }' "$OVR" > "$T"
            cat "$T" > "$OVR"; rm -f "$T"
          fi
          cd "$D"
          docker compose config --quiet
          # Vault: upsert, SQL przez stdin; bez logowania instrukcji
          { printf '%s\n' "begin;" "set local log_statement = 'none';" "set local log_min_duration_statement = -1;" \
              "do \$\$ declare v_id uuid; begin" \
              "  select id into v_id from vault.secrets where name = 'generate_game_secret';"
            printf "  if v_id is null then perform vault.create_secret('%s', 'generate_game_secret');\n" "$GG"
            printf "  else perform vault.update_secret(v_id, '%s'); end if;\n" "$GG"
            printf '%s\n' "end \$\$;" "commit;"
          } | docker exec -i supabase-db psql -q -U supabase_admin -d postgres -v ON_ERROR_STOP=1 > /dev/null
          # funkcje Edge: odtworzenie kontenera z nowym env (jak deploy-edge.sh, bez przebudowy zależności)
          docker compose up -d --no-deps functions > /dev/null 2>&1
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Running}}' supabase-edge-functions 2>/dev/null)" = true ] && break; sleep 2
          done
          echo "functions running: $(docker inspect -f '{{.State.Running}}' supabase-edge-functions)"
          echo "backup suffix: .bak-rotate-$TS"
          EOS
          scp -q -i ~/.ssh/id_ed25519 "$RUNNER_TEMP/rot.sh" "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:.rotate-secrets.sh"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" 'bash ~/.rotate-secrets.sh; R=$?; rm -f ~/.rotate-secrets.sh; exit $R' < "$RUNNER_TEMP/vals" > "$RUNNER_TEMP/rot.out" 2>&1 || { echo "::error title=Serwer::$(tr '\n' ' ' < "$RUNNER_TEMP/rot.out" | cut -c1-500)"; exit 1; }
          echo "::notice title=Serwer::$(tr '\n' ' ' < "$RUNNER_TEMP/rot.out")"

      - name: Redeploy lead-finder (jak deploy-lead-finder.yml, nowy env)
        run: |
          STAGING="/home/${{ secrets.SERVER_USER }}/.deploy/lead-finder/${{ github.sha }}-rot"
          SSH="ssh -i $HOME/.ssh/id_ed25519 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          $SSH "mkdir -p \"$STAGING\""
          rsync -az --delete --checksum --exclude '__pycache__' --exclude '.git' \
            -e "ssh -i $HOME/.ssh/id_ed25519" services/lead-finder/ \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:$STAGING/"
          $SSH "/home/${{ secrets.SERVER_USER }}/supabase-selfhost/supabase/scripts/deploy-lead-finder.sh \"$STAGING\"" > "$RUNNER_TEMP/lf.out" 2>&1 || { echo "::error title=lead-finder::deploy nieudany"; tail -n 5 "$RUNNER_TEMP/lf.out"; $SSH "rm -rf \"$STAGING\""; exit 1; }
          $SSH "rm -rf \"$STAGING\""
          grep -q "Service is healthy" "$RUNNER_TEMP/lf.out" && H=true || H=false
          echo "::notice title=lead-finder::health: $H"

      - name: Verify (booleans only)
        run: |
          cat > "$RUNNER_TEMP/ver.sh" <<'EOS'
          read -r GG; read -r LF
          h() { tr -d '\n' | sha256sum | cut -d' ' -f1; }
          envof() { docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$1" | grep "^$2=" | cut -d= -f2-; }
          G=$(printf '%s' "$GG" | h); L=$(printf '%s' "$LF" | h)
          VG=$(docker exec supabase-db psql -U supabase_admin -d postgres -tA -c "select decrypted_secret from vault.decrypted_secrets where name='generate_game_secret'" | h)
          VM=$(docker exec supabase-db psql -U supabase_admin -d postgres -tA -c "select decrypted_secret from vault.decrypted_secrets where name='mail_worker_secret'" | h)
          EG=$(envof supabase-edge-functions GENERATE_GAME_SECRET | h)
          EM=$(envof supabase-edge-functions MAIL_WORKER_SECRET | h)
          EL=$(envof supabase-edge-functions LEAD_FINDER_API_KEY | h)
          LL=$(envof familiada-lead-finder LEAD_FINDER_API_KEY | h)
          FG=$(grep '^GENERATE_GAME_SECRET=' ~/supabase-selfhost/supabase/docker/.env | cut -d= -f2- | h)
          E=$(printf '' | h)
          b() { [ "$1" = "$2" ] && echo true || echo false; }
          echo "vault_generate_game_secret==GG:$(b $VG $G)"
          echo "edge_GENERATE_GAME_SECRET==GG:$(b $EG $G)"
          echo "env_file_GENERATE_GAME_SECRET==GG:$(b $FG $G)"
          echo "edge_MAIL_WORKER_SECRET_nonempty:$([ "$EM" != "$E" ] && echo true || echo false)"
          echo "edge_MAIL_WORKER_SECRET==vault:$(b $EM $VM)"
          echo "leadfinder_LEAD_FINDER_API_KEY==LF:$(b $LL $L)"
          echo "edge_LEAD_FINDER_API_KEY==LF:$(b $EL $L)"
          echo "edge_running:$(docker inspect -f '{{.State.Running}}' supabase-edge-functions)"
          echo "leadfinder_running:$(docker inspect -f '{{.State.Running}}' familiada-lead-finder)"
          EOS
          scp -q -i ~/.ssh/id_ed25519 "$RUNNER_TEMP/ver.sh" "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:.rotate-verify.sh"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" 'bash ~/.rotate-verify.sh; rm -f ~/.rotate-verify.sh' < "$RUNNER_TEMP/vals" > "$RUNNER_TEMP/ver.out" 2>&1 || true
          grep -E '^[a-zA-Z_=]+:(true|false)$' "$RUNNER_TEMP/ver.out" > "$RUNNER_TEMP/ver.ok" || true
          echo "::notice title=Weryfikacja::$(awk '{printf "%s%%0A", $0}' "$RUNNER_TEMP/ver.ok")"
          ! grep -q ':false$' "$RUNNER_TEMP/ver.ok" && [ -s "$RUNNER_TEMP/ver.ok" ]

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/vals" ~/.ssh/id_ed25519
