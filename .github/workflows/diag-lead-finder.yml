name: Diagnostyka lead-finder (jednorazowa, tylko odczyt)

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Diagnostyka (bez sekretów)
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" 'bash -s' <<'REMOTE'
          mask() { sed -E 's/(--token|token:|TUNNEL_TOKEN=|credentials-file:)[ =]*[^ ]+/\1 ***/g; s/eyJ[A-Za-z0-9._-]{20,}/***/g'; }
          echo "== nasłuchujące porty (80/443/8001/8000 i inne publiczne)"
          (ss -ltnp 2>/dev/null || sudo -n ss -ltnp 2>/dev/null) | awk 'NR==1 || /:80 |:443 |:8001 |:8000 |:8443 /' | sed -E 's/pid=[0-9]+,fd=[0-9]+/pid/g'
          echo "== usługi proxy na hoście"
          systemctl list-units --type=service --state=running --no-pager 2>/dev/null | grep -iE 'nginx|caddy|apache|haproxy|traefik|cloudflare|tunnel' || echo "(brak)"
          echo "== wszystkie kontenery (nazwa | obraz | porty)"
          docker ps --format '{{.Names}} | {{.Image}} | {{.Ports}}'
          echo "== konfiguracje z leads/8001"
          for d in /etc/nginx /etc/caddy /etc/cloudflared /etc/haproxy ~/supabase-selfhost; do [ -d "$d" ] && grep -rIlsE 'leads\.familiada|:8001' "$d" 2>/dev/null | grep -v -E '/node_modules/|\.git/|/volumes/db/' | head -10; done
          for f in $(grep -rIlsE 'leads\.familiada' /etc/nginx /etc/caddy 2>/dev/null); do echo "-- $f"; grep -nE 'server_name|listen|proxy_pass|reverse_proxy|leads' "$f" | mask; done
          echo "== Caddyfile / nginx server_name (lista hostów)"
          grep -rhsE '^\s*server_name' /etc/nginx 2>/dev/null | sort -u | head -20
          for f in /etc/caddy/Caddyfile ~/Caddyfile; do [ -r "$f" ] && grep -nE '^[^ #].*\{|reverse_proxy' "$f"; done
          echo "== lokalnie z nagłówkiem Host"
          for p in 80 443; do sch=http; [ $p = 443 ] && sch=https; printf '%s :%s Host=leads /health -> ' $sch $p; curl -sk -o /dev/null -w '%{http_code}\n' --max-time 5 -H 'Host: leads.familiada.online' "$sch://127.0.0.1:$p/health"; done
          printf 'https SNI leads -> '; curl -sk -o /dev/null -w '%{http_code}\n' --max-time 5 --resolve leads.familiada.online:443:127.0.0.1 https://leads.familiada.online/health
          printf 'https SNI api -> '; curl -sk -o /dev/null -w '%{http_code}\n' --max-time 5 --resolve api.familiada.online:443:127.0.0.1 https://api.familiada.online/rest/v1/
          echo "== DNS z serwera"
          getent hosts leads.familiada.online api.familiada.online | awk '{print $2, ($1 ~ /^(104\.|172\.6|188\.114|2606:4700)/ ? "cloudflare-proxy" : "inny")}'
          echo "== historia: kontener lead-findera utworzony"
          docker inspect familiada-lead-finder --format '{{.Created}}'
          REMOTE
