name: Diagnostyka lead-finder (jednorazowa, tylko odczyt)

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Diagnostyka (bez sekretów)
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" 'bash -s' <<'REMOTE'
          M='s/[A-Za-z0-9_+\/=-]{16,}/<ukryte>/g'
          echo "== Caddyfile: blok leads (wartości >=16 znaków ukryte)"
          awk '/^leads\.familiada\.online/{f=1} f{print NR": "$0} f&&/^}/{exit}' /etc/caddy/Caddyfile | sed -E "$M"
          echo "== porównanie klucza (tylko true/false)"
          ENVF=~/supabase-selfhost/supabase/docker/.env
          K=$(grep -E '^LEAD_FINDER_API_KEY=' "$ENVF" | head -1 | cut -d= -f2- | tr -d '"'"'"'\r')
          printf 'klucz w .env niepusty: '; [ -n "$K" ] && echo true || echo false
          printf 'Caddyfile zawiera bieżący klucz: '; grep -qF -- "$K" /etc/caddy/Caddyfile && echo true || echo false
          for b in /etc/caddy/Caddyfile.backup /etc/caddy/Caddyfile.backup2; do printf '%s zawiera bieżący klucz: ' "$b"; grep -qF -- "$K" "$b" && echo true || echo false; done
          printf 'kontener lead-findera ma bieżący klucz: '; docker exec familiada-lead-finder printenv LEAD_FINDER_API_KEY 2>/dev/null | grep -qxF -- "$K" && echo true || echo false
          printf 'lokalnie :8001 z bieżącym kluczem /status -> '; curl -s -o /dev/null -w '%{http_code}\n' --max-time 5 -H "Authorization: Bearer $K" http://localhost:8001/api/search-runs/status
          printf 'Caddy (SNI leads) z bieżącym kluczem /status -> '; curl -sk -o /dev/null -w '%{http_code}\n' --max-time 5 -H "Authorization: Bearer $K" --resolve leads.familiada.online:443:127.0.0.1 https://leads.familiada.online/api/search-runs/status
          printf 'Caddy (SNI leads) z bieżącym kluczem jako X-API-Key /status -> '; curl -sk -o /dev/null -w '%{http_code}\n' --max-time 5 -H "X-API-Key: $K" --resolve leads.familiada.online:443:127.0.0.1 https://leads.familiada.online/api/search-runs/status
          ls -l --time-style=+%F_%T /etc/caddy/ | awk '{print $6, $7}'
          systemctl is-active caddy
          REMOTE
