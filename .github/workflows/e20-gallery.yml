name: E20 · galeria stron (Playwright + prawdziwe dane)

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Lista ID stron rozdzielona przecinkami; puste = wszystkie strony"
        required: false
        default: ""
      profiles:
        description: "Profile: macbook, ipad-portrait, ipad-landscape, iphone-portrait, iphone-landscape; puste = wszystkie"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      E2E_BYPASS_SECRET: ${{ secrets.E2E_BYPASS_SECRET }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      E20_GALLERY_PAGES: ${{ inputs.pages || '' }}
      E20_GALLERY_PROFILES: ${{ inputs.profiles || '' }}
    steps:
      - name: Pobierz branch wskazany przy uruchomieniu
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Zainstaluj zależności Playwright
        run: npm ci
        working-directory: tests

      - name: Chromium
        run: npx playwright install --with-deps chromium
        working-directory: tests

      - name: Zrzuty każdej strony i profilu
        run: npx playwright test e2e/e20-gallery.spec.js --workers=1 --retries=0
        working-directory: tests

      - name: Zbuduj mobilną galerię HTML i manifest
        if: ${{ always() && hashFiles('tests/test-results/e20-gallery/manifest-*.json') != '' }}
        run: node scripts/agent-tools/build-e20-gallery.cjs

      - name: Udostępnij galerię i surowe zrzuty jako artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e20-gallery-${{ github.run_number }}
          path: |
            tests/test-results/e20-gallery/
            tests/test-results/
          if-no-files-found: warn
          retention-days: 30
