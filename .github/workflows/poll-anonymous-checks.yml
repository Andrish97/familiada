name: Anonymous poll isolated contracts
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/poll-anonymous-checks.yml'
      - 'docs/sql/*poll-anonymous*362*'
permissions:
  contents: read
jobs:
  verify-anonymous-poll:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: fam362draft
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: fam362draft
      PGPASSWORD: isolated-test-password
      ANON362_PSQL: psql
      ANON362_DDL_PSQL: psql
    steps:
      - uses: actions/checkout@v4
      - name: Restore the actual immutable pre362 schema
        run: |
          git fetch --no-tags --depth=1 origin 1d9da88bb18b47e249d3e70dcec83c2792b5f898
          git show 1d9da88bb18b47e249d3e70dcec83c2792b5f898:supabase/schema.sql > /tmp/pre-anonymous-schema.sql
          psql -v ON_ERROR_STOP=1 -f docs/sql/local-stubs.sql
          psql -v ON_ERROR_STOP=1 -c 'ALTER EXTENSION pg_trgm SET SCHEMA public'
          sed -e 's/"public"\."vector"(384)/real[]/g' -e 's/"p_embedding" "public"\."vector"/"p_embedding" real[]/' -e '/market_games_embedding_ivfflat_idx/d' -e '/transaction_timeout/d' -e '/CREATE SCHEMA "public";/d' /tmp/pre-anonymous-schema.sql > /tmp/anonymous-schema.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/anonymous-schema.sql > /tmp/anonymous-restore.log 2>&1
          psql -v ON_ERROR_STOP=1 -f docs/sql/restore-identity-auth-triggers-358.sql
      - name: Complete forms, browser scope, task regression and lifecycle races
        run: |
          psql -v ON_ERROR_STOP=1 -f docs/sql/draft-poll-anonymous-362.sql
          psql -v ON_ERROR_STOP=1 -f docs/sql/test-poll-anonymous-362.sql
          python3 docs/sql/test-poll-anonymous-362-concurrency.py
      - name: Restore a clean database for the final migration
        env:
          PGDATABASE: fam362final
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE fam362final'
          sed '1d' docs/sql/local-stubs.sql > /tmp/anonymous-final-stubs.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/anonymous-final-stubs.sql
          psql -v ON_ERROR_STOP=1 -c 'ALTER EXTENSION pg_trgm SET SCHEMA public'
          psql -v ON_ERROR_STOP=1 -f /tmp/anonymous-schema.sql > /tmp/anonymous-final-restore.log 2>&1
          psql -v ON_ERROR_STOP=1 -f docs/sql/restore-identity-auth-triggers-358.sql
      - name: Final DDL versus legacy writer and all contracts
        env:
          PGDATABASE: fam362final
        run: |
          python3 docs/sql/test-poll-anonymous-final-ddl-362.py
          sed 's/_prototype//g' docs/sql/test-poll-anonymous-362.sql > /tmp/anonymous-final-contract.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/anonymous-final-contract.sql
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anonymous-poll-isolated-restore
          path: |
            /tmp/anonymous-restore.log
            /tmp/anonymous-final-restore.log
