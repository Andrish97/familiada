name: Control 2 device lease SQL checks

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  device-leases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated lease lifecycle fixture
        env:
          PGPASSWORD: test-only-password
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE device_leases_test'
          psql -h localhost -U postgres -d device_leases_test -v ON_ERROR_STOP=1 -f tests/sql/control2-device-leases.sql
      - name: Race registrations and prove one primary per slot
        env:
          PGPASSWORD: test-only-password
        run: python3 tests/sql/control2-device-leases-concurrency.py
