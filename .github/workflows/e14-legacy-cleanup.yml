name: E14 legacy cleanup contract

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/e14-legacy-cleanup.yml'
      - 'docs/sql/test-e14-legacy-cleanup.sql'
      - 'supabase/migrations/*368*'

permissions:
  contents: read

jobs:
  verify-e14:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: e14-test-password
          POSTGRES_DB: e14_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: e14_test
      PGPASSWORD: e14-test-password
    steps:
      - uses: actions/checkout@v4
      - name: Restore current production schema with local Supabase stubs
        run: |
          psql -v ON_ERROR_STOP=1 -f docs/sql/local-stubs.sql
          psql -v ON_ERROR_STOP=1 -c 'ALTER EXTENSION pg_trgm SET SCHEMA public'
          sed -e 's/"public"\."vector"(384)/real[]/g' \
              -e 's/"p_embedding" "public"\."vector"/"p_embedding" real[]/' \
              -e '/market_games_embedding_ivfflat_idx/d' \
              -e '/transaction_timeout/d' \
              -e '/CREATE SCHEMA "public";/d' \
              supabase/schema.sql > /tmp/e14-schema.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/e14-schema.sql > /tmp/e14-restore.log 2>&1
      - name: Apply E14 removals and verify replacement contracts
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/2026-10-13_368_remove_legacy_poll_paths.sql
          psql -v ON_ERROR_STOP=1 -f docs/sql/test-e14-legacy-cleanup.sql
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e14-schema-restore
          path: /tmp/e14-restore.log
