name: Manual screenshots

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "tests/e2e/manual-screenshots.spec.js"
      - ".github/workflows/manual-screenshots.yml"
  # Ręczny przebieg odświeża zrzuty we wszystkich językach bez zmiany strony.
  workflow_dispatch:

# Zrzuty pokazują strony z main; przykładowe dane powstają lokalnie w przeglądarce.
# Nie logują się na konta ani nie zapisują danych w bazie. PNG są artefaktami.
concurrency:
  group: manual-screenshots-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  screenshots:
    name: Screenshots (${{ matrix.lang }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Local fixtures keep the language captures independent.
      max-parallel: 3
      matrix:
        lang: [pl, en, uk]
    env:
      SCREENSHOT_LANG: ${{ matrix.lang }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: tests

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: tests

      - name: Capture localized pages from main with local visual data
        working-directory: tests
        run: npx playwright test e2e/manual-screenshots.spec.js --workers=1

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-screenshots-${{ matrix.lang }}-${{ github.run_id }}
          path: tests/test-results/**/shot-*.png
          if-no-files-found: error
          retention-days: 14
