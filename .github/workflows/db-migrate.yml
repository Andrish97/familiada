name: Apply DB migrations + update schema.sql (self-host)

permissions:
  contents: write

on:
  push:
    branches: ["main"]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch: {}

jobs:
  verify-control-statistics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: statistics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Check additive migration and statistics lifecycle in isolated database
        env:
          PGPASSWORD: test-only-password
        run: psql -h localhost -U postgres -d statistics_test -v ON_ERROR_STOP=1 -f tests/sql/control2-sessions.sql
      - name: Check concurrent telemetry and gameplay preserve events
        env:
          PGPASSWORD: test-only-password
        run: python3 tests/sql/control2-sessions-concurrency.py
      - name: Check cleanup migration preserves session history
        env:
          PGPASSWORD: test-only-password
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cleanup_test'
          psql -h localhost -U postgres -d cleanup_test -v ON_ERROR_STOP=1 -f tests/sql/control-cleanup.sql
      - name: Check Host2 logo keys and active editing locks
        env:
          PGPASSWORD: test-only-password
        run: psql -h localhost -U postgres -d statistics_test -v ON_ERROR_STOP=1 -f tests/sql/host2-logo.sql
      - name: Check maintenance activity and shared exclusions
        env:
          PGPASSWORD: test-only-password
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE activity_test'
          psql -h localhost -U postgres -d activity_test -v ON_ERROR_STOP=1 -f tests/sql/maintenance-activity.sql
      - name: Check Display completion guards
        env:
          PGPASSWORD: test-only-password
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE display_completion_test'
          psql -h localhost -U postgres -d display_completion_test -v ON_ERROR_STOP=1 -f tests/sql/display-completion.sql
      - name: Check durable Display audio unlock sessions
        env:
          PGPASSWORD: test-only-password
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE display_audio_unlock_test'
          psql -h localhost -U postgres -d display_audio_unlock_test -v ON_ERROR_STOP=1 -f tests/sql/display-audio-unlock.sql
      - name: Check shared demo DRAW PNG updates only untouched copies
        env:
          PGPASSWORD: test-only-password
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE demo_draw_test'
          psql -h localhost -U postgres -d demo_draw_test -v ON_ERROR_STOP=1 -f tests/sql/demo-draw-shared-png.sql
  migrate:
    needs: verify-control-statistics
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1️⃣ Checkout (z możliwością push)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # 2️⃣ Zadbaj o strukturę katalogów (jeśli nie istnieją)
      - name: Ensure local folders exist
        run: |
          mkdir -p supabase
          mkdir -p supabase/migration_logs

      # 3️⃣ Install SSH + rsync
      - name: Install rsync + ssh
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client

      # 4️⃣ Setup SSH
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      # 5️⃣ Sync migrations to server
      - name: Sync migrations to server staging
        run: |
          STAGING="/home/${{ secrets.SERVER_USER }}/.deploy/db-migrate/${{ github.sha }}"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "mkdir -p \"$STAGING/migrations\" \"$STAGING/out\""

          rsync -az --delete --checksum \
            --exclude '.DS_Store' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            supabase/migrations/ \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:$STAGING/migrations/"

          rsync -az --checksum -e "ssh -i ~/.ssh/id_ed25519" \
            scripts/apply-migrations.sh \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:$STAGING/apply-migrations.sh"

      - name: Back up retired Control snapshots before cleanup
        run: |
          STAGING="/home/${{ secrets.SERVER_USER }}/.deploy/db-migrate/${{ github.sha }}"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "bash -s -- \"$STAGING\"" < scripts/backup-legacy-control.sh

      # 6️⃣ Run migrations on server
      - name: Run migrations (server-side)
        run: |
          STAGING="/home/${{ secrets.SERVER_USER }}/.deploy/db-migrate/${{ github.sha }}"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "export GITHUB_SHA='${{ github.sha }}'; \
             bash \"$STAGING/apply-migrations.sh\" \"$STAGING\""

      - name: Verify shared demo DRAW PNG migration on production
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            'docker exec -i supabase-db psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1' \
            < tests/sql/demo-draw-shared-png-production.sql

      - name: Verify activity writes and exclusions on production database
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            'docker exec -i supabase-db psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1' \
            < tests/sql/maintenance-activity-production.sql

      - name: Verify legacy Control cleanup and preserve current game tables
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            'docker exec -i supabase-db psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1' \
            < tests/sql/control-cleanup-production.sql

      # 7️⃣ Fetch schema + logs (bez wywalania się)
      - name: Fetch schema.sql + logs from server
        run: |
          STAGING="/home/${{ secrets.SERVER_USER }}/.deploy/db-migrate/${{ github.sha }}"
          mkdir -p supabase/migration_logs
      
          rsync -az --checksum -e "ssh -i ~/.ssh/id_ed25519" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:$STAGING/out/schema.sql" \
            "supabase/schema.sql"
      
          rsync -az --checksum -e "ssh -i ~/.ssh/id_ed25519" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:$STAGING/out/latest.log" \
            "supabase/migration_logs/latest.log"
      
      # 8️⃣ Keep only last 30 logs (jeśli istnieją)
      - name: Keep only last 30 run logs
        run: |
          if [ -d "supabase/migration_logs" ]; then
            cd supabase/migration_logs
            ls -1t *.log 2>/dev/null | tail -n +31 | xargs -r rm -f
            cd -
          fi

      # 9️⃣ Commit tylko jeśli coś się zmieniło
      - name: Commit schema.sql + logs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add supabase/schema.sql supabase/migration_logs || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "db: update schema + logs [skip ci]" || true
          git pull --rebase --strategy-option=theirs || true
          git push
