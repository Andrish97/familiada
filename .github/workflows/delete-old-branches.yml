name: Usuwanie starych gałęzi (jednorazowe)

# Po zastąpieniu historii jednym commitem (2026-10-29, zgoda właściciela):
# usuwa wszystkie gałęzie poza main i wskazanymi w `keep`. Tylko ręcznie.
on:
  workflow_dispatch:
    inputs:
      keep:
        description: "Gałęzie do zachowania (spacja), poza main"
        default: "ccr-81591762-zqlgxa nazwy-wewnetrzne"

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-24.04
    steps:
      - name: Usuń gałęzie
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ inputs.keep }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" -q '.[].name' > all.txt
          n=0
          while read -r b; do
            [ "$b" = main ] && continue
            case " $KEEP " in *" $b "*) continue ;; esac
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$b" >/dev/null && n=$((n+1)) || echo "nie usunięto: $b"
          done < all.txt
          echo "usunięto gałęzi: $n"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" -q '.[].name'
