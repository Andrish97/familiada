<!doctype html>
<html lang="pl">
<head>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Familiada — Control (v2)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<style>
  :root { color-scheme: dark; --bg:#0b0e14; --card:#12161f; --line:rgba(255,255,255,.12); --text:#eef1f6; --accent:#ffeaa6; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }

  .c2-topbar { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; border-bottom:1px solid var(--line); }
  .c2-topbar-actions { display:flex; gap:8px; }
  .c2-icon-btn { background:rgba(255,255,255,.06); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:6px 10px; cursor:pointer; }
  .c2-icon-btn:hover { background:rgba(255,255,255,.12); }

  .c2-main { flex:1; display:flex; align-items:center; justify-content:center; padding:16px; overflow:hidden; }
  .card.c2-card { width:min(720px, 100%); max-height:100%; background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:0 24px 60px rgba(0,0,0,.4); overflow:auto; }
  .c2-card-inner { padding:24px; display:flex; flex-direction:column; gap:14px; }

  .c2-device-row { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); }
  .c2-device-label { display:flex; align-items:center; gap:8px; }
  .c2-dot { width:10px; height:10px; border-radius:50%; background:#555; }
  .c2-dot.on { background:#5fd97a; }
  .c2-dot.off { background:#e05c5c; }
  .c2-device-actions { display:flex; align-items:center; gap:10px; }
  .c2-code { opacity:.75; font-variant-numeric: tabular-nums; }

  .c2-btn { background:rgba(255,255,255,.08); border:1px solid var(--line); color:var(--text); border-radius:12px; padding:10px 14px; cursor:pointer; font-weight:600; }
  .c2-btn:hover { background:rgba(255,255,255,.14); }
  .c2-btn.primary { background:rgba(255,234,166,.14); border-color:rgba(255,234,166,.4); color:var(--accent); }
  .c2-btn:disabled { opacity:.4; cursor:not-allowed; }

  label { font-size:.85rem; opacity:.8; margin-top:6px; }
  input[type="text"], select { background:rgba(255,255,255,.06); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:8px 10px; }

  /* Wspólny szablon 3 głównych ekranów rozgrywki (sekcja 3b) — jedna karta,
     zero przewijania, mały stepper na górze, nawigacja na dole. */
  .c2-gameplay { height: 100%; max-height: 640px; }
  .c2-stepper { font-size:.75rem; letter-spacing:.08em; text-transform:uppercase; opacity:.65; border-bottom:1px solid var(--line); padding-bottom:8px; }
  .c2-gameplay-body { flex:1; overflow:auto; display:flex; flex-direction:column; gap:12px; }
  .c2-gameplay-nav { display:flex; gap:8px; justify-content:flex-end; border-top:1px solid var(--line); padding-top:10px; flex-wrap:wrap; }

  .c2-question { font-size:1.1rem; font-weight:700; }
  .c2-answers-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; }
  .c2-answer-btn { padding:12px; border-radius:12px; border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--text); cursor:pointer; }
  .c2-answer-btn.revealed { background:rgba(95,217,122,.15); border-color:rgba(95,217,122,.4); }
  .c2-bank { font-weight:700; }
  .c2-duel { display:flex; align-items:center; gap:10px; }
  .c2-repeat-label { display:flex; align-items:center; gap:6px; margin-top:0; }
  .c2-final-answers { display:flex; flex-direction:column; gap:6px; }
</style>
</head>
<body>
  <div class="c2-topbar">
    <div class="c2-topbar-title">Familiada — Control</div>
    <div class="c2-topbar-actions">
      <button class="c2-icon-btn" id="btnMute" type="button" title="Wycisz dźwięk">🔊</button>
      <button class="c2-icon-btn" id="btnStartOver" type="button" title="Zacznij od nowa">↺ Zacznij od nowa</button>
    </div>
  </div>
  <div class="c2-main">
    <div class="card c2-card" id="app"><!-- renderowane przez ui.js --></div>
  </div>

  <script type="module" src="control2/js/app.js?v=v2026-09-05T07201"></script>
</body>
</html>
