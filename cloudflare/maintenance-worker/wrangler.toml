name = "familiada"
main = "src/index.js"
compatibility_date = "2024-01-01"
# Worker tylko pod domenami familiada.online (trasy w panelu Cloudflare);
# adres *.workers.dev i podglądy wersji omijałyby Cloudflare Access.
workers_dev = false
preview_urls = false

[[kv_namespaces]]
binding = "MAINT_KV"
id = "a23c036852434c5da77287d82973f183"

[triggers]
crons = ["0 3 * * *"]

[vars]
SUPABASE_URL = "https://api.familiada.online"
# Cloudflare Access (panel admina, weryfikacja podpisu JWT) — wartości jawne
CF_ACCESS_TEAM_DOMAIN = "familiada.cloudflareaccess.com"
CF_ACCESS_AUD = "a07dd0a38af828cd052b5f72dc7ad0ba69771bf7606522635367d4b4b0a13675"

[observability]
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false
